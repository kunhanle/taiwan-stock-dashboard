<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taiwan Stock Market Dashboard</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & Libraries (CDNJs) -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin
        src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.12.0/Recharts.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.6.7/axios.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- ApexCharts -->
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-apexcharts"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>


    <style>
        body {
            background-color: #0f172a;
            color: #e2e8f0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .table-row-hover:hover {
            background-color: rgba(255, 255, 255, 0.05);
            cursor: pointer;
        }
    </style>

    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { slate: { 850: '#151e32' } } }
            }
        }
    </script>
</head>

<body>
    <div id="root">
        <div class="h-screen flex items-center justify-center text-slate-500">
            Initializing Dashboard...
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // Recharts setup
        let RechartsObj = window.Recharts;
        if (RechartsObj && RechartsObj.default) RechartsObj = RechartsObj.default;

        const {
            LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer,
            AreaChart, Area, BarChart, Bar, Cell, ReferenceLine,
            ComposedChart
        } = RechartsObj || {};

        // --- API ---
        const fetchMarketData = async () => {
            try {
                const response = await axios.get('/api/market-stats');
                if (Array.isArray(response.data)) {
                    return { history: response.data, distribution: null };
                }
                return response.data;
            } catch (error) {
                console.error("Failed to fetch market data", error);
                return { history: [], distribution: null };
            }
        };

        const fetchCategoryStats = async (selectedDate = null) => {
            try {
                const url = selectedDate
                    ? `/api/category-stats?date=${selectedDate}`
                    : '/api/category-stats';
                const response = await axios.get(url);
                return response.data;
            } catch (error) {
                console.error("Failed to fetch category stats", error);
                return null;
            }
        };

        const fetchCategoryDetails = async (categoryName) => {
            try {
                const response = await axios.get(`/api/category-details/${encodeURIComponent(categoryName)}`);
                return response.data;
            } catch (error) {
                console.error("Failed to fetch category details", error);
                return null;
            }
        };

        // --- Components ---
        const CustomTooltip = ({ active, payload, label }) => {
            if (active && payload && payload.length) {
                return (
                    <div className="glass-panel p-3 rounded-lg border border-slate-700 text-sm">
                        <p className="font-bold text-slate-200 mb-1">{label}</p>
                        {payload.map((entry, index) => (
                            <div key={index} className="flex items-center gap-2" style={{ color: entry.color }}>
                                <span className="w-2 h-2 rounded-full" style={{ backgroundColor: entry.color }}></span>
                                <span>{entry.name}: {entry.value}</span>
                            </div>
                        ))}
                    </div>
                );
            }
            return null;
        };

        const HighLowChart = ({ data }) => {
            if (!RechartsObj) return null;
            return (
                <div className="h-[300px] w-full">
                    <ResponsiveContainer width="100%" height="100%">
                        <LineChart data={data} margin={{ top: 10, right: 10, left: 0, bottom: 0 }}>
                            <CartesianGrid strokeDasharray="3 3" stroke="#334155" vertical={false} />
                            <XAxis dataKey="date" stroke="#94a3b8" tick={{ fontSize: 12 }} tickFormatter={(str) => str.slice(5)} minTickGap={30} />
                            <YAxis stroke="#94a3b8" tick={{ fontSize: 12 }} />
                            <Tooltip content={<CustomTooltip />} />
                            <Legend wrapperStyle={{ paddingTop: '10px' }} />
                            <Line type="monotone" dataKey="new_high_52w" name="Within 5% of 52w High" stroke="#ef4444" strokeWidth={2} dot={false} activeDot={{ r: 6 }} />
                            <Line type="monotone" dataKey="new_low_52w" name="Within 5% of 52w Low" stroke="#22c55e" strokeWidth={2} dot={false} activeDot={{ r: 6 }} />
                        </LineChart>
                    </ResponsiveContainer>
                </div>
            );
        };

        const MAShadedChart = ({ data, keyAbove, keyBelow, title1, title2, colorAbove, colorBelow }) => {
            if (!RechartsObj) return null;
            return (
                <div className="h-[300px] w-full">
                    <ResponsiveContainer width="100%" height="100%">
                        <AreaChart data={data} margin={{ top: 10, right: 10, left: 0, bottom: 0 }}>
                            <defs>
                                <linearGradient id={`grad${keyAbove}`} x1="0" y1="0" x2="0" y2="1">
                                    <stop offset="5%" stopColor={colorAbove} stopOpacity={0.3} />
                                    <stop offset="95%" stopColor={colorAbove} stopOpacity={0} />
                                </linearGradient>
                                <linearGradient id={`grad${keyBelow}`} x1="0" y1="0" x2="0" y2="1">
                                    <stop offset="5%" stopColor={colorBelow} stopOpacity={0.3} />
                                    <stop offset="95%" stopColor={colorBelow} stopOpacity={0} />
                                </linearGradient>
                            </defs>
                            <CartesianGrid strokeDasharray="3 3" stroke="#334155" vertical={false} />
                            <XAxis dataKey="date" stroke="#94a3b8" tick={{ fontSize: 12 }} tickFormatter={(str) => str.slice(5)} minTickGap={30} />
                            <YAxis stroke="#94a3b8" tick={{ fontSize: 12 }} />
                            <Tooltip content={<CustomTooltip />} />
                            <Legend wrapperStyle={{ paddingTop: '10px' }} />
                            <Area type="monotone" dataKey={keyAbove} name={title1} stroke={colorAbove} fill={`url(#grad${keyAbove})`} strokeWidth={2} />
                            <Area type="monotone" dataKey={keyBelow} name={title2} stroke={colorBelow} fill={`url(#grad${keyBelow})`} strokeWidth={2} />
                        </AreaChart>
                    </ResponsiveContainer>
                </div>
            );
        };

        const DistributionChart = ({ data, date }) => {
            if (!RechartsObj) return null;
            return (
                <div className="h-[300px] w-full">
                    <div className="text-right text-xs text-slate-400 mb-2">Likely Date: {date}</div>
                    <ResponsiveContainer width="100%" height="100%">
                        <BarChart data={data} margin={{ top: 10, right: 10, left: 0, bottom: 0 }}>
                            <CartesianGrid strokeDasharray="3 3" stroke="#334155" vertical={false} />
                            <XAxis dataKey="bin" stroke="#94a3b8" tick={{ fontSize: 12 }} />
                            <YAxis stroke="#94a3b8" tick={{ fontSize: 12 }} />
                            <Tooltip cursor={{ fill: 'rgba(255,255,255,0.05)' }} content={<CustomTooltip />} />
                            <Bar dataKey="count" name="Stock Count" fill="#facc15" radius={[4, 4, 0, 0]}>
                                {data.map((entry, index) => (
                                    <Cell key={`cell-${index}`} fill={entry.value < 0 ? '#ef4444' : (entry.value > 0 ? '#22c55e' : '#94a3b8')} />
                                ))}
                            </Bar>
                        </BarChart>
                    </ResponsiveContainer>
                </div>
            );
        };

        const MaintenanceRatioChart = ({ data }) => {
            if (!RechartsObj) return null;
            return (
                <div className="h-[300px] w-full">
                    <ResponsiveContainer width="100%" height="100%">
                        <LineChart data={data} margin={{ top: 10, right: 10, left: 0, bottom: 0 }}>
                            <CartesianGrid strokeDasharray="3 3" stroke="#334155" vertical={false} />
                            <XAxis dataKey="date" stroke="#94a3b8" tick={{ fontSize: 12 }} tickFormatter={(str) => str.slice(5)} minTickGap={30} />
                            <YAxis stroke="#94a3b8" tick={{ fontSize: 12 }} domain={['auto', 'auto']} tickFormatter={(v) => `${(v * 100).toFixed(0)}%`} />
                            <Tooltip
                                content={({ active, payload, label }) => {
                                    if (active && payload && payload.length) {
                                        return (
                                            <div className="glass-panel p-3 rounded-lg border border-slate-700 text-sm">
                                                <p className="font-bold text-slate-200 mb-1">{label}</p>
                                                <div className="flex items-center gap-2" style={{ color: payload[0].color }}>
                                                    <span>{payload[0].name}: {(payload[0].value * 100).toFixed(2)}%</span>
                                                </div>
                                            </div>
                                        );
                                    }
                                    return null;
                                }}
                            />
                            <Legend wrapperStyle={{ paddingTop: '10px' }} />
                            <ReferenceLine y={1.30} stroke="red" strokeDasharray="3 3" label={{ position: 'right', value: '130% Risk', fill: 'red', fontSize: 12 }} />
                            <Line type="monotone" dataKey="maintenance_ratio" name="融資維持率" stroke="#38bdf8" strokeWidth={2} dot={false} activeDot={{ r: 6 }} />
                        </LineChart>
                    </ResponsiveContainer>
                </div>
            );
        };

        const WVFChart = ({ data }) => {
            if (!RechartsObj) return null;
            return (
                <div className="h-[300px] w-full">
                    <ResponsiveContainer width="100%" height="100%">
                        <LineChart data={data} margin={{ top: 10, right: 10, left: 0, bottom: 0 }}>
                            <CartesianGrid strokeDasharray="3 3" stroke="#334155" vertical={false} />
                            <XAxis dataKey="date" stroke="#94a3b8" tick={{ fontSize: 12 }} tickFormatter={(str) => str.slice(5)} minTickGap={30} />
                            <YAxis stroke="#94a3b8" tick={{ fontSize: 12 }} />
                            <Tooltip content={<CustomTooltip />} />
                            <Legend wrapperStyle={{ paddingTop: '10px' }} />
                            <Line type="monotone" dataKey="wvf" name="Williams Vix Fix (WVF)" stroke="#a855f7" strokeWidth={2} dot={false} activeDot={{ r: 6 }} />
                            <Line type="monotone" dataKey="wvf_upper" name="Upper Band (BB)" stroke="#fbbf24" strokeWidth={2} strokeDasharray="5 5" dot={false} />
                        </LineChart>
                    </ResponsiveContainer>
                </div>
            );
        };

        // --- Category Components ---

        const CategoryTable = ({ data, title, columns, onSelect }) => (
            <div className="glass-panel rounded-2xl p-6 h-full">
                <h3 className="text-lg font-semibold text-slate-200 mb-4 flex items-center gap-2">
                    <i data-lucide="list" className="w-5 h-5 text-blue-400"></i>
                    {title}
                </h3>
                <div className="overflow-x-auto">
                    <table className="w-full text-left text-sm text-slate-400">
                        <thead className="text-xs uppercase bg-slate-800/50 text-slate-300">
                            <tr>
                                <th className="px-4 py-3 rounded-tl-lg">Category</th>
                                <th className="px-4 py-3 text-right rounded-tr-lg">{columns.valueLabel}</th>
                            </tr>
                        </thead>
                        <tbody>
                            {data.map((row, idx) => (
                                <tr key={idx} onClick={() => onSelect(row.name)} className="border-b border-slate-700/50 table-row-hover transition-colors">
                                    <td className="px-4 py-3 font-medium text-blue-300">{row.name}</td>
                                    <td className="px-4 py-3 text-right text-slate-200 font-mono">
                                        {columns.renderValue(row)}
                                    </td>
                                </tr>
                            ))}
                            {data.length === 0 && (
                                <tr><td colSpan="2" className="px-4 py-3 text-center text-slate-500">No data available</td></tr>
                            )}
                        </tbody>
                    </table>
                </div>
            </div>
        );

        const CandlestickChart = ({ data, stockId, stockName }) => {
            const chartRef = useRef(null);

            useEffect(() => {
                if (!chartRef.current || !data || data.length === 0) return;

                // Calculate max volume for consistent scaling
                const volumes = data.map(d => d.volume || 0);
                const maxVol = Math.max(...volumes, 1); // Avoid 0

                const options = {
                    series: [
                        {
                            name: 'Price',
                            type: 'candlestick',
                            data: data.map(d => ({
                                x: d.date,
                                y: [d.open, d.high, d.low, d.close]
                            }))
                        },
                        {
                            name: 'Volume',
                            type: 'bar',
                            data: data.map(d => ({
                                x: d.date,
                                y: d.volume
                            }))
                        }
                    ],
                    chart: {
                        id: `chart-${stockId}`,
                        type: 'candlestick',
                        height: 400,
                        background: 'transparent',
                        toolbar: { show: false }
                    },
                    colors: ['#2E93fA', '#60a5fa'],
                    title: {
                        text: `${stockId} - ${stockName}`,
                        align: 'left',
                        style: {
                            color: '#e2e8f0',
                            fontSize: '14px',
                            fontWeight: 600
                        }
                    },
                    xaxis: {
                        type: 'category',
                        tickAmount: 10,
                        labels: {
                            style: { colors: '#94a3b8' },
                            formatter: function (val) {
                                if (typeof val === 'string' && val.length > 5) {
                                    return val.slice(5);
                                }
                                return val;
                            }
                        },
                        axisBorder: { color: '#334155' },
                        axisTicks: { color: '#334155' }
                    },
                    yaxis: [
                        {
                            seriesName: 'Price',
                            tooltip: { enabled: true },
                            labels: {
                                style: { colors: '#94a3b8' },
                                formatter: (val) => val?.toFixed(2) || ''
                            }
                        },
                        {
                            seriesName: 'Volume',
                            opposite: true,
                            min: 0,
                            max: maxVol * 3, // Scale volume to lower ~33%
                            tickAmount: 2,
                            forceNiceScale: false,
                            labels: {
                                show: false
                            }
                        }
                    ],
                    grid: {
                        borderColor: '#334155',
                        strokeDashArray: 3
                    },
                    plotOptions: {
                        candlestick: {
                            colors: {
                                upward: '#ef4444',
                                downward: '#22c55e'
                            }
                        },
                        bar: {
                            columnWidth: '50%'
                        }
                    },
                    tooltip: {
                        shared: false,
                        intersect: true,
                        custom: function ({ seriesIndex, dataPointIndex, w }) {
                            const d = data[dataPointIndex];
                            // With category axis, ensure we get data correctly
                            if (!d) return '';

                            if (seriesIndex === 0) {
                                // Candlestick tooltip
                                return `<div class="px-3 py-2 bg-slate-800 border border-slate-700 rounded text-xs">
                                    <div class="font-bold mb-1">${d.date}</div>
                                    <div>Open: ${d.open.toFixed(2)}</div>
                                    <div>High: ${d.high.toFixed(2)}</div>
                                    <div>Low: ${d.low.toFixed(2)}</div>
                                    <div>Close: ${d.close.toFixed(2)}</div>
                                </div>`;
                            } else {
                                // Volume tooltip
                                return `<div class="px-3 py-2 bg-slate-800 border border-slate-700 rounded text-xs">
                                    <div class="font-bold mb-1">${d.date}</div>
                                    <div>Volume: ${(d.volume / 1000).toFixed(0)}K</div>
                                </div>`;
                            }
                        }
                    },
                    theme: { mode: 'dark' }
                };

                const chart = new ApexCharts(chartRef.current, options);
                chart.render();

                return () => chart.destroy();
            }, [data, stockId, stockName]);

            return <div ref={chartRef} className="w-full"></div>;
        };

        const CategoryDetailView = ({ category, onBack }) => {
            const [details, setDetails] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                fetchCategoryDetails(category).then(data => {
                    setDetails(data);
                    setLoading(false);
                });
            }, [category]);

            return (
                <div className="space-y-6 animate-fade-in">
                    <button onClick={onBack} className="flex items-center gap-2 text-blue-400 hover:text-blue-300 transition-colors mb-4">
                        <i data-lucide="arrow-left" className="w-5 h-5"></i> Back to Dashboard
                    </button>

                    <div className="glass-panel p-6 rounded-2xl mb-6">
                        <h2 className="text-2xl font-bold text-white mb-2">{category} Category Analysis</h2>
                        <p className="text-slate-400">1-Year Historical Performance for Stocks in this Category</p>
                    </div>

                    {loading ? (
                        <div className="text-center py-20 text-slate-500 animate-pulse">Loading charts...</div>
                    ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            {details &&
                                details.stocks &&
                                Object.entries(details.stocks).map(([stockId, stockInfo]) => (
                                    <div key={stockId} className="glass-panel p-4 rounded-xl">
                                        <CandlestickChart
                                            data={stockInfo.data}
                                            stockId={stockId}
                                            stockName={stockInfo.name}
                                        />
                                    </div>
                                ))}
                        </div>
                    )}
                </div>
            );
        };

        // --- Level Analysis Components ---
        const LevelCandlestickChart = ({ data, levels, tp, stockId, stockName, displayDays = 65 }) => {
            const chartRef = useRef(null);

            useEffect(() => {
                if (!chartRef.current || !data || data.length === 0) return;

                const recentData = data.slice(-displayDays);

                const volumes = recentData.map(d => d.volume || 0);
                const maxVol = Math.max(...volumes, 1);
                const lastClose = recentData[recentData.length - 1].close;

                // Support levels: sort descending, assign colors
                const supportColors = ['#4ade80', '#facc15', '#a855f7', '#ef4444'];
                const sortedLevels = [...levels].sort((a, b) => b - a);

                // Title color based on where price sits among support levels
                let titleColor = '#e2e8f0';
                if (sortedLevels.length >= 3) {
                    if (lastClose < sortedLevels[2]) titleColor = '#a855f7';
                    else if (lastClose < sortedLevels[1]) titleColor = '#3b82f6';
                }

                // Y-axis: include tp and all support levels
                const priceHighs = recentData.map(d => d.high);
                const priceLows = recentData.map(d => d.low);
                const allValues = [...priceHighs, ...priceLows, ...levels, ...(tp ? [tp] : [])];
                const minY = Math.min(...allValues) * 0.95;
                const maxY = Math.max(...allValues) * 1.05;

                // Build annotations: TP first (gold), then support levels
                const yaxisAnnotations = [];
                if (tp && tp > 0) {
                    yaxisAnnotations.push({
                        y: tp,
                        borderColor: '#f59e0b',
                        label: {
                            borderColor: '#f59e0b',
                            style: { color: '#000', background: '#f59e0b', fontWeight: 700 },
                            text: `停利: ${tp}`
                        }
                    });
                }
                sortedLevels.forEach((lvl, idx) => {
                    const color = supportColors[idx] || '#cbd5e1';
                    yaxisAnnotations.push({
                        y: lvl,
                        borderColor: color,
                        label: {
                            borderColor: color,
                            style: { color: '#fff', background: color },
                            text: `L${idx + 1}: ${lvl}`
                        }
                    });
                });

                const options = {
                    series: [
                        {
                            name: 'Price',
                            type: 'candlestick',
                            data: recentData.map(d => ({ x: d.date, y: [d.open, d.high, d.low, d.close] }))
                        },
                        {
                            name: 'Volume',
                            type: 'bar',
                            data: recentData.map(d => ({ x: d.date, y: d.volume }))
                        }
                    ],
                    chart: {
                        id: `level-chart-${stockId}`,
                        type: 'candlestick',
                        height: 350,
                        background: 'transparent',
                        toolbar: { show: false }
                    },
                    colors: ['#2E93fA', '#60a5fa'],
                    title: {
                        text: `${stockId} ${stockName}`,
                        align: 'center',
                        style: { color: titleColor, fontSize: '16px', fontWeight: 700 }
                    },
                    annotations: { yaxis: yaxisAnnotations },
                    xaxis: {
                        type: 'category',
                        tickAmount: 5,
                        labels: {
                            style: { colors: '#94a3b8' },
                            formatter: (val) => (typeof val === 'string' && val.length > 5) ? val.slice(5) : val
                        }
                    },
                    yaxis: [
                        {
                            seriesName: 'Price',
                            min: minY,
                            max: maxY,
                            labels: { style: { colors: '#94a3b8' }, formatter: (val) => val?.toFixed(1) }
                        },
                        {
                            seriesName: 'Volume',
                            opposite: true,
                            min: 0,
                            max: maxVol * 4,
                            labels: { show: false }
                        }
                    ],
                    grid: { borderColor: '#334155', strokeDashArray: 3 },
                    plotOptions: {
                        candlestick: { colors: { upward: '#ef4444', downward: '#22c55e' } },
                        bar: { columnWidth: '50%' }
                    },
                    theme: { mode: 'dark' }
                };

                const chart = new ApexCharts(chartRef.current, options);
                chart.render();

                return () => chart.destroy();
            }, [data, levels, tp, stockId, stockName, displayDays]);

            return <div ref={chartRef} className="w-full"></div>;
        };

        const LevelAnalysisSection = () => {
            const [rows, setRows] = useState([{ id: '', tp: '', levels: [''] }]);
            const [analyzedStocks, setAnalyzedStocks] = useState(null);
            const [loading, setLoading] = useState(false);
            const [chartDisplayDays, setChartDisplayDays] = useState({});
            const stockDataCache = useRef({});

            // AI dialog state
            const [showDialog, setShowDialog] = useState(false);
            const [dialogText, setDialogText] = useState('');
            const [dialogStockId, setDialogStockId] = useState('');
            const [extracting, setExtracting] = useState(false);
            const [extracted, setExtracted] = useState(null);
            const [editedTp, setEditedTp] = useState('');
            const [editedLevels, setEditedLevels] = useState(['', '', '']);
            const [dialogModel, setDialogModel] = useState('');
            const [availableModels, setAvailableModels] = useState([]);

            useEffect(() => {
                const loadPreset = async () => {
                    try {
                        const res = await axios.get('/api/preset-levels');
                        if (res.data.stocks && res.data.stocks.length > 0) {
                            const newRows = res.data.stocks.map(s => ({
                                id: s.stock_id,
                                tp: s.take_profit != null ? String(s.take_profit) : '',
                                levels: s.levels.length > 0 ? s.levels.map(String) : ['']
                            }));
                            setRows(newRows);
                        }
                    } catch (e) {
                        console.error("Failed to load preset levels:", e);
                    }
                };
                loadPreset();
            }, []);

            useEffect(() => {
                axios.get('/api/ai-models').then(res => {
                    const models = res.data.models || [];
                    setAvailableModels(models);
                    if (models.length > 0) {
                        const preferred = models.find(m => m.toLowerCase().includes('flash')) || models[0];
                        setDialogModel(preferred);
                    }
                }).catch(() => {});
            }, []);

            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [rows, analyzedStocks, showDialog, extracted]);

            const handleExtract = async () => {
                if (!dialogText.trim()) return;
                setExtracting(true);
                setExtracted(null);
                try {
                    const res = await axios.post('/api/extract-levels', { text: dialogText, model: dialogModel || null });
                    if (res.data.error) {
                        alert('解析失敗：' + res.data.error);
                    } else {
                        setExtracted(res.data);
                        setEditedTp(res.data.take_profit != null ? String(res.data.take_profit) : '');
                        const lvls = res.data.levels || [];
                        setEditedLevels([
                            lvls[0] != null ? String(lvls[0]) : '',
                            lvls[1] != null ? String(lvls[1]) : '',
                            lvls[2] != null ? String(lvls[2]) : ''
                        ]);
                    }
                } catch (e) {
                    alert('解析失敗，請確認 Gemini API Key 已設定');
                } finally {
                    setExtracting(false);
                }
            };

            const handleApplyExtracted = () => {
                const targetId = dialogStockId.trim();
                if (!targetId) { alert('請輸入股票代碼'); return; }

                const newRow = {
                    id: targetId,
                    tp: editedTp,
                    levels: editedLevels.filter(l => l.trim())
                };

                const existingIdx = rows.findIndex(r => r.id === targetId);
                let newRows;
                if (existingIdx >= 0) {
                    newRows = [...rows];
                    newRows[existingIdx] = newRow;
                } else {
                    // Replace trailing empty row if present, otherwise append
                    const lastRow = rows[rows.length - 1];
                    if (rows.length > 0 && !lastRow.id.trim()) {
                        newRows = [...rows.slice(0, -1), newRow];
                    } else {
                        newRows = [...rows, newRow];
                    }
                }

                setRows(newRows);
                setShowDialog(false);
                setDialogText('');
                setExtracted(null);
                setEditedTp('');
                setEditedLevels(['', '', '']);
            };

            const saveData = async (currentRows) => {
                const stocks = currentRows
                    .filter(r => r.id.trim())
                    .map(r => ({
                        stock_id: r.id.trim(),
                        take_profit: parseFloat(r.tp) > 0 ? parseFloat(r.tp) : null,
                        levels: r.levels.map(Number).filter(n => !isNaN(n) && n > 0)
                    }));
                try {
                    await axios.post('/api/save-levels', { stocks });
                } catch (e) {
                    console.error("Failed to save levels:", e);
                }
            };

            const handleIdChange = (idx, val) => {
                const newRows = [...rows];
                newRows[idx] = { ...newRows[idx], id: val };
                setRows(newRows);
            };

            const handleTpChange = (idx, val) => {
                const newRows = [...rows];
                newRows[idx] = { ...newRows[idx], tp: val };
                setRows(newRows);
            };

            const handleLevelChange = (idx, lIdx, val) => {
                const newRows = [...rows];
                const newLevels = [...newRows[idx].levels];
                newLevels[lIdx] = val;
                newRows[idx] = { ...newRows[idx], levels: newLevels };
                setRows(newRows);
            };

            const handleAddLevel = (idx) => {
                const newRows = [...rows];
                newRows[idx] = { ...newRows[idx], levels: [...newRows[idx].levels, ''] };
                setRows(newRows);
            };

            const handleRemoveLevel = (idx, lIdx) => {
                const newRows = [...rows];
                const newLevels = newRows[idx].levels.filter((_, i) => i !== lIdx);
                newRows[idx] = { ...newRows[idx], levels: newLevels.length > 0 ? newLevels : [''] };
                setRows(newRows);
            };

            const handleRemoveRow = async (idx) => {
                const sid = rows[idx].id;
                const newRows = rows.filter((_, i) => i !== idx);
                setRows(newRows);
                await saveData(newRows);
                if (sid && analyzedStocks?.[sid]) {
                    const newAnalyzed = { ...analyzedStocks };
                    delete newAnalyzed[sid];
                    setAnalyzedStocks(Object.keys(newAnalyzed).length > 0 ? newAnalyzed : null);
                }
            };

            const addRow = () => setRows([...rows, { id: '', tp: '', levels: [''] }]);

            const handleAnalyze = async () => {
                setLoading(true);
                await saveData(rows);

                const stockIds = [];
                const stockLevels = {};
                const stockTps = {};
                rows.forEach(r => {
                    if (r.id.trim()) {
                        stockIds.push(r.id.trim());
                        stockLevels[r.id] = r.levels.map(Number).filter(n => !isNaN(n) && n > 0);
                        const tp = parseFloat(r.tp);
                        stockTps[r.id] = !isNaN(tp) && tp > 0 ? tp : null;
                    }
                });

                if (stockIds.length === 0) { setLoading(false); return; }

                try {
                    const toFetch = stockIds.filter(id => !stockDataCache.current[id]);
                    if (toFetch.length > 0) {
                        const response = await axios.post('/api/batch-stock-data', { stock_ids: toFetch });
                        Object.assign(stockDataCache.current, response.data.stocks);
                    }

                    const finalResult = {};
                    stockIds.forEach(sid => {
                        if (stockDataCache.current[sid]) {
                            finalResult[sid] = {
                                ...stockDataCache.current[sid],
                                levels: stockLevels[sid] || [],
                                tp: stockTps[sid] || null
                            };
                        }
                    });
                    setAnalyzedStocks(finalResult);
                } catch (err) {
                    console.error(err);
                    alert("Analysis Failed");
                } finally {
                    setLoading(false);
                }
            };

            const getDisplayDays = (sid) => chartDisplayDays[sid] || 65;
            const setDisplayDays = (sid, days) => setChartDisplayDays(prev => ({ ...prev, [sid]: days }));
            const timeRanges = [{ label: '1M', days: 22 }, { label: '3M', days: 65 }, { label: '6M', days: 130 }, { label: '1Y', days: 250 }];

            const alerts = useMemo(() => {
                if (!analyzedStocks) return [];
                const result = [];
                Object.entries(analyzedStocks).forEach(([sid, info]) => {
                    if (!info.data || info.data.length === 0) return;
                    const latest = info.data[info.data.length - 1];
                    const price = latest.close;
                    const date = latest.date;
                    const label = `${sid} ${info.name}`;

                    if (info.tp && price >= info.tp) {
                        result.push({ type: 'tp', label, price, date, ref: `停利 ${info.tp}`, msg: '已達停利點' });
                    }
                    const sortedLevels = [...info.levels].sort((a, b) => b - a);
                    sortedLevels.forEach((lvl, idx) => {
                        if (price < lvl) {
                            result.push({ type: 'breach', label, price, date, ref: `L${idx + 1} ${lvl}`, msg: `跌穿 L${idx + 1}` });
                        }
                    });
                });
                return result;
            }, [analyzedStocks]);

            return (
                <div className="space-y-6">
                    {/* AI Extract Dialog */}
                    {showDialog && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm" onClick={e => e.target === e.currentTarget && setShowDialog(false)}>
                            <div className="glass-panel rounded-2xl p-6 w-full max-w-2xl mx-4 space-y-4 border border-slate-600 max-h-[90vh] overflow-y-auto">
                                <div className="flex items-center justify-between">
                                    <h3 className="text-lg font-bold text-white flex items-center gap-2">
                                        <i data-lucide="sparkles" className="w-5 h-5 text-emerald-400"></i>
                                        AI 解析 — 自動提取價位
                                    </h3>
                                    <button onClick={() => setShowDialog(false)} className="text-slate-400 hover:text-white transition-colors">
                                        <i data-lucide="x" className="w-5 h-5"></i>
                                    </button>
                                </div>

                                <div className="grid grid-cols-2 gap-3">
                                    <div className="space-y-1">
                                        <label className="text-xs text-slate-400 font-semibold">套用至股票代碼</label>
                                        <input
                                            value={dialogStockId}
                                            onChange={e => setDialogStockId(e.target.value)}
                                            placeholder="e.g. 2330"
                                            className="w-full bg-slate-800 text-white p-2.5 rounded-lg border border-slate-700 text-sm focus:outline-none focus:border-blue-500 transition-colors"
                                        />
                                    </div>
                                    <div className="space-y-1">
                                        <label className="text-xs text-slate-400 font-semibold">Gemini 模型</label>
                                        <select
                                            value={dialogModel}
                                            onChange={e => setDialogModel(e.target.value)}
                                            className="w-full bg-slate-800 text-white p-2.5 rounded-lg border border-slate-700 text-sm focus:outline-none focus:border-blue-500 transition-colors cursor-pointer"
                                        >
                                            {availableModels.length === 0 && <option value="">載入中...</option>}
                                            {availableModels.map(m => (
                                                <option key={m} value={m}>{m.replace('models/', '')}</option>
                                            ))}
                                        </select>
                                    </div>
                                </div>

                                <div className="space-y-1">
                                    <label className="text-xs text-slate-400 font-semibold">貼入分析文字</label>
                                    <textarea
                                        value={dialogText}
                                        onChange={e => setDialogText(e.target.value)}
                                        rows={9}
                                        placeholder={"例如：\n四層風險參考層級 (由輕至重)：\n層級一 (情緒支撐)：680.0 元\n層級二 (溫和支撐)：528.0 元\n層級三 (熊市支撐)：329.1 元\n目標價：750 元"}
                                        className="w-full bg-slate-900 text-slate-200 p-3 rounded-lg border border-slate-700 text-sm resize-none focus:outline-none focus:border-emerald-500 transition-colors leading-relaxed"
                                    />
                                </div>

                                <button
                                    onClick={handleExtract}
                                    disabled={extracting || !dialogText.trim()}
                                    className="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-2.5 rounded-lg font-bold transition-all disabled:opacity-50 flex items-center justify-center gap-2"
                                >
                                    {extracting
                                        ? <><i data-lucide="loader" className="animate-spin w-4 h-4"></i> 解析中...</>
                                        : <><i data-lucide="sparkles" className="w-4 h-4"></i> 開始解析</>
                                    }
                                </button>

                                {extracted && (
                                    <div className="space-y-3 border-t border-slate-700 pt-4">
                                        <p className="text-xs text-slate-400 font-semibold tracking-wide uppercase">解析結果（可直接修改）</p>
                                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                                            <div className="space-y-1">
                                                <label className="text-xs text-yellow-400 font-semibold">停利點</label>
                                                <input
                                                    value={editedTp}
                                                    onChange={e => setEditedTp(e.target.value)}
                                                    className="w-full bg-slate-800 border border-yellow-500/50 text-yellow-300 p-2 rounded-lg text-sm text-center focus:outline-none focus:border-yellow-400"
                                                    placeholder="—"
                                                />
                                            </div>
                                            {['L1', 'L2', 'L3'].map((label, i) => (
                                                <div key={i} className="space-y-1">
                                                    <label className="text-xs text-slate-400 font-semibold">{label} 防守</label>
                                                    <input
                                                        value={editedLevels[i]}
                                                        onChange={e => {
                                                            const nl = [...editedLevels];
                                                            nl[i] = e.target.value;
                                                            setEditedLevels(nl);
                                                        }}
                                                        className="w-full bg-slate-800 border border-slate-700 text-white p-2 rounded-lg text-sm text-center focus:outline-none focus:border-blue-400"
                                                        placeholder="—"
                                                    />
                                                </div>
                                            ))}
                                        </div>
                                        <button
                                            onClick={handleApplyExtracted}
                                            className="w-full bg-blue-600 hover:bg-blue-500 text-white py-2.5 rounded-lg font-bold transition-all flex items-center justify-center gap-2"
                                        >
                                            <i data-lucide="check-circle" className="w-4 h-4"></i>
                                            套用至 {dialogStockId || '（請填入股票代碼）'}
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Alert System */}
                    {alerts.length > 0 && (
                        <div className="rounded-2xl border border-red-500/40 overflow-hidden">
                            <div className="flex items-center gap-2 px-5 py-3 bg-red-500/10 border-b border-red-500/30">
                                <i data-lucide="bell-ring" className="w-5 h-5 text-red-400"></i>
                                <span className="font-bold text-red-300 text-base">Alert System</span>
                                <span className="ml-1 text-xs bg-red-500/30 text-red-300 px-2 py-0.5 rounded-full font-mono">{alerts.length}</span>
                            </div>
                            <div className="divide-y divide-slate-700/50">
                                {alerts.map((a, idx) => (
                                    <div key={idx} className={`flex items-center gap-3 px-5 py-3 text-sm ${a.type === 'tp' ? 'bg-yellow-500/5' : 'bg-red-500/5'}`}>
                                        <i data-lucide={a.type === 'tp' ? 'target' : 'trending-down'} className={`w-4 h-4 flex-shrink-0 ${a.type === 'tp' ? 'text-yellow-400' : 'text-red-400'}`}></i>
                                        <span className={`font-bold flex-shrink-0 ${a.type === 'tp' ? 'text-yellow-300' : 'text-red-300'}`}>{a.label}</span>
                                        <span className={`font-semibold flex-shrink-0 ${a.type === 'tp' ? 'text-yellow-400' : 'text-red-400'}`}>{a.msg}</span>
                                        <span className="text-slate-400 text-xs">
                                            現價 <span className="text-white font-mono">{a.price.toFixed(2)}</span>
                                            {a.type === 'tp' ? ' ≥ ' : ' < '}
                                            <span className="font-mono">{a.ref}</span>
                                        </span>
                                        <span className="ml-auto text-slate-500 text-xs flex-shrink-0">{a.date}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                    <div className="glass-panel p-6 rounded-2xl">
                        <div className="flex items-center gap-3 border-b border-slate-700 pb-3 mb-4">
                            <h3 className="text-lg font-semibold text-blue-400">Custom Levels</h3>
                            <span className="text-xs text-yellow-400 bg-yellow-400/10 border border-yellow-400/30 px-2 py-0.5 rounded-full">金色 = 停利點</span>
                            <span className="text-xs text-green-400 bg-green-400/10 border border-green-400/30 px-2 py-0.5 rounded-full">綠/黃/紫/紅 = 防守區位</span>
                            <button
                                onClick={() => setShowDialog(true)}
                                className="ml-auto flex items-center gap-1.5 text-xs text-emerald-400 hover:text-emerald-300 border border-emerald-500/30 hover:border-emerald-400/60 bg-emerald-500/5 hover:bg-emerald-500/10 px-3 py-1.5 rounded-lg transition-all"
                            >
                                <i data-lucide="sparkles" className="w-3.5 h-3.5"></i>
                                AI 解析
                            </button>
                        </div>
                        <div className="space-y-2 max-h-96 overflow-y-auto pr-2">
                            {rows.map((r, idx) => (
                                <div key={idx} className="flex items-center gap-2 flex-wrap py-0.5">
                                    <input
                                        placeholder="Stock ID"
                                        className="bg-slate-800 text-white p-2 rounded w-24 text-center flex-shrink-0 text-sm"
                                        value={r.id}
                                        onChange={e => handleIdChange(idx, e.target.value)}
                                    />
                                    {/* 停利點 */}
                                    <input
                                        placeholder="停利點"
                                        className="bg-slate-800 border border-yellow-500/50 text-yellow-300 p-2 rounded w-24 text-center flex-shrink-0 text-sm placeholder-yellow-700"
                                        value={r.tp}
                                        onChange={e => handleTpChange(idx, e.target.value)}
                                    />
                                    <div className="w-px h-5 bg-slate-600 flex-shrink-0"></div>
                                    {/* Support levels */}
                                    {r.levels.map((lvl, lIdx) => (
                                        <div key={lIdx} className="flex items-center gap-1">
                                            <input
                                                placeholder={`L${lIdx + 1}`}
                                                className="bg-slate-800 text-white p-2 rounded w-20 text-center text-sm"
                                                value={lvl}
                                                onChange={e => handleLevelChange(idx, lIdx, e.target.value)}
                                            />
                                            {r.levels.length > 1 && (
                                                <button onClick={() => handleRemoveLevel(idx, lIdx)} className="text-slate-500 hover:text-red-400 transition-colors flex-shrink-0">
                                                    <i data-lucide="x" className="w-3 h-3"></i>
                                                </button>
                                            )}
                                        </div>
                                    ))}
                                    <button onClick={() => handleAddLevel(idx)} className="text-emerald-400 hover:text-emerald-300 p-1 transition-colors flex-shrink-0" title="新增防守區位">
                                        <i data-lucide="plus-circle" className="w-4 h-4"></i>
                                    </button>
                                    <button onClick={() => handleRemoveRow(idx)} className="text-slate-600 hover:text-red-400 p-1 transition-colors flex-shrink-0 ml-1" title="移除此股票">
                                        <i data-lucide="trash-2" className="w-4 h-4"></i>
                                    </button>
                                </div>
                            ))}
                        </div>
                        <div className="mt-4 pt-4 border-t border-slate-700 flex items-center justify-between">
                            <button onClick={addRow} className="text-sm text-blue-400 hover:text-blue-300 font-semibold flex items-center gap-1">
                                <i data-lucide="plus" className="w-4 h-4"></i> Add Stock
                            </button>
                            <button onClick={handleAnalyze} disabled={loading} className="bg-blue-600 hover:bg-blue-500 text-white px-8 py-3 rounded-lg font-bold shadow-lg shadow-blue-900/20 hover:shadow-blue-900/40 transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2">
                                {loading ? <i data-lucide="loader" className="animate-spin"></i> : <i data-lucide="bar-chart-2"></i>}
                                {loading ? 'Loading...' : 'Save & Analyze'}
                            </button>
                        </div>
                    </div>

                    {analyzedStocks && (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            {Object.entries(analyzedStocks).map(([sid, info]) => (
                                <div key={sid} className="glass-panel p-4 rounded-xl">
                                    <div className="flex justify-end gap-1 mb-2">
                                        {timeRanges.map(({ label, days }) => (
                                            <button
                                                key={label}
                                                onClick={() => setDisplayDays(sid, days)}
                                                className={`px-2 py-1 text-xs rounded transition-colors ${getDisplayDays(sid) === days ? 'bg-blue-600 text-white' : 'bg-slate-700 text-slate-400 hover:text-white'}`}
                                            >
                                                {label}
                                            </button>
                                        ))}
                                    </div>
                                    <LevelCandlestickChart
                                        data={info.data}
                                        levels={info.levels}
                                        tp={info.tp}
                                        stockId={sid}
                                        stockName={info.name}
                                        displayDays={getDisplayDays(sid)}
                                    />
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        // --- Correlation Analysis Components ---
        const CorrelationChart = ({ data, series1Name, series2Name, series1Key = 'stock_price', series2Key = 'metal_price', title }) => {
            const chartRef = useRef(null);

            useEffect(() => {
                if (!chartRef.current || !data || data.length === 0) return;

                const series1Data = data.map(d => d[series1Key]);
                const series2Data = data.map(d => d[series2Key]);

                // Calculate constraints for dual y-axis
                const min1 = Math.min(...series1Data) * 0.95;
                const max1 = Math.max(...series1Data) * 1.05;
                const min2 = Math.min(...series2Data) * 0.95;
                const max2 = Math.max(...series2Data) * 1.05;

                const options = {
                    series: [
                        {
                            name: series1Name,
                            type: 'line',
                            data: data.map(d => ({ x: d.date, y: d[series1Key] }))
                        },
                        {
                            name: series2Name,
                            type: 'line',
                            data: data.map(d => ({ x: d.date, y: d[series2Key] }))
                        }
                    ],
                    chart: {
                        id: `chart-${Math.random().toString(36).substr(2, 9)}`,
                        type: 'line',
                        height: 400,
                        background: 'transparent',
                        toolbar: {
                            show: true,
                            tools: { download: false }
                        }
                    },
                    colors: ['#0ea5e9', '#f59e0b'],
                    stroke: { width: [3, 3], curve: 'smooth' },
                    title: {
                        text: title,
                        align: 'left',
                        style: { color: '#f8fafc', fontSize: '18px' }
                    },
                    xaxis: {
                        type: 'category',
                        tickAmount: 10,
                        labels: {
                            style: { colors: '#94a3b8' },
                            formatter: (val) => (typeof val === 'string' && val.length > 5) ? val.slice(5) : val
                        }
                    },
                    yaxis: [
                        {
                            seriesName: series1Name,
                            min: min1,
                            max: max1,
                            title: { text: series1Name, style: { color: '#0ea5e9' } },
                            labels: { style: { colors: '#0ea5e9' }, formatter: (val) => val.toFixed(1) }
                        },
                        {
                            seriesName: series2Name,
                            opposite: true,
                            min: min2,
                            max: max2,
                            title: { text: series2Name, style: { color: '#f59e0b' } },
                            labels: { style: { colors: '#f59e0b' }, formatter: (val) => val.toFixed(2) }
                        }
                    ],
                    grid: { borderColor: '#334155', strokeDashArray: 3 },
                    theme: { mode: 'dark' },
                    legend: { position: 'top', horizontalAlign: 'right' }
                };

                const chart = new ApexCharts(chartRef.current, options);
                chart.render();

                return () => chart.destroy();
            }, [data, series1Name, series2Name, series1Key, series2Key, title]);

            const handleDownload = async () => {
                const element = chartRef.current.parentElement;
                if (!element) return;
                try {
                    const canvas = await window.html2canvas(element, { backgroundColor: '#0f172a', scale: 2 });
                    canvas.toBlob((blob) => {
                        window.saveAs(blob, `${title.replace(/\s+/g, '_')}.jpg`);
                    }, 'image/jpeg');
                } catch (err) { console.error(err); }
            };

            return (
                <div className="relative group">
                    <button onClick={handleDownload} className="absolute top-2 right-12 z-10 bg-slate-800/80 hover:bg-slate-700 p-2 rounded text-slate-300 hover:text-white transition-colors opacity-0 group-hover:opacity-100">
                        <i data-lucide="download" className="w-4 h-4"></i>
                    </button>
                    <div ref={chartRef} className="w-full"></div>
                </div>
            );
        };

        const CorrelationAnalysisSection = () => {
            const [stockInputs, setStockInputs] = useState(['2002.TW', '2014.TW']);
            const [metal, setMetal] = useState('Nickel');
            const [startDate, setStartDate] = useState(new Date(new Date().setFullYear(new Date().getFullYear() - 1)).toISOString().split('T')[0]);
            const [endDate, setEndDate] = useState(new Date().toISOString().split('T')[0]);
            const [results, setResults] = useState(null);
            const [loading, setLoading] = useState(false);

            const metals = ['None', 'Aluminium', 'Copper', 'Nickel', 'Lead', 'Zinc', 'Tin', 'Platinum', 'Gold', 'Silver'];

            const handleAddStock = () => setStockInputs([...stockInputs, '']);
            const handleRemoveStock = (index) => setStockInputs(stockInputs.filter((_, i) => i !== index));
            const handleStockChange = (index, value) => {
                const newInputs = [...stockInputs];
                newInputs[index] = value;
                setStockInputs(newInputs);
            };

            const handleAnalyze = async (overrideMetal = null) => {
                setLoading(true);
                setResults(null);

                const stockIds = stockInputs.map(s => s.trim()).filter(s => s);
                if (stockIds.length === 0) {
                    alert('Please enter at least one stock ID');
                    setLoading(false);
                    return;
                }

                let metalToSend = (overrideMetal !== null) ? overrideMetal : metal;
                if (metalToSend === 'None') metalToSend = null;

                try {
                    const response = await axios.post('/api/analyze', {
                        stock_ids: stockIds,
                        metal: metalToSend,
                        start_date: startDate,
                        end_date: endDate
                    });
                    setResults(response.data);
                } catch (error) {
                    console.error("Analysis Error:", error);
                    alert("Analysis failed.");
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="space-y-8">
                    {/* Controls */}
                    <div className="glass-panel p-6 rounded-2xl">
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">

                            {/* Stock IDs */}
                            <div className="space-y-2 lg:col-span-2">
                                <label className="text-sm text-slate-400 font-semibold flex justify-between items-center">
                                    <span>Stock IDs</span>
                                    <div className="flex gap-2">
                                        <button onClick={() => handleAnalyze('None')} className="text-blue-400 text-xs hover:text-blue-300 transition-colors flex items-center gap-1 font-bold border border-blue-500/30 px-2 py-1 rounded">
                                            <i data-lucide="git-compare" className="w-3 h-3"></i> Compare Stocks
                                        </button>
                                        <button onClick={handleAddStock} className="text-emerald-400 text-xs hover:text-emerald-300 transition-colors flex items-center gap-1">
                                            <i data-lucide="plus-circle" className="w-3 h-3"></i> Add Stock
                                        </button>
                                    </div>
                                </label>
                                <div className="space-y-2 max-h-48 overflow-y-auto pr-2 custom-scrollbar">
                                    {stockInputs.map((input, idx) => (
                                        <div key={idx} className="flex gap-2 items-center animate-fade-in">
                                            <input
                                                type="text"
                                                value={input}
                                                onChange={(e) => handleStockChange(idx, e.target.value)}
                                                className="flex-1 bg-slate-800/50 border border-slate-700 rounded-lg px-4 py-2 text-white focus:ring-2 focus:ring-emerald-500 focus:outline-none placeholder-slate-600"
                                                placeholder="e.g. 2002.TW"
                                            />
                                            {stockInputs.length > 1 && (
                                                <button onClick={() => handleRemoveStock(idx)} className="p-2 text-red-500 hover:bg-slate-800/50 rounded-lg transition-colors">
                                                    <i data-lucide="trash-2" className="w-4 h-4"></i>
                                                </button>
                                            )}
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="space-y-2">
                                <label className="text-sm text-slate-400 font-semibold">Metal</label>
                                <select
                                    value={metal}
                                    onChange={(e) => setMetal(e.target.value)}
                                    className="w-full bg-slate-800/50 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:ring-2 focus:ring-emerald-500 focus:outline-none cursor-pointer"
                                >
                                    {metals.map(m => <option key={m} value={m}>{m}</option>)}
                                </select>
                            </div>

                            <div className="space-y-2">
                                <label className="text-sm text-slate-400 font-semibold">Date Range</label>
                                <div className="flex gap-2">
                                    <input type="date" value={startDate} onChange={(e) => setStartDate(e.target.value)} className="w-1/2 bg-slate-800/50 border border-slate-700 rounded-lg px-2 py-2.5 text-white text-xs" />
                                    <input type="date" value={endDate} onChange={(e) => setEndDate(e.target.value)} className="w-1/2 bg-slate-800/50 border border-slate-700 rounded-lg px-2 py-2.5 text-white text-xs" />
                                </div>
                            </div>

                            <div className="flex items-end">
                                <button
                                    onClick={() => handleAnalyze()}
                                    disabled={loading}
                                    className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-8 rounded-lg shadow-lg shadow-emerald-900/20 hover:shadow-emerald-900/40 transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2"
                                >
                                    {loading ? <i data-lucide="loader" className="animate-spin"></i> : <i data-lucide="play-circle"></i>}
                                    {loading ? 'Running...' : 'Run Analysis'}
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* Results Container */}
                    <div className="space-y-12">

                        {/* Stock vs Metal Results */}
                        {results && results.stock_results && results.metal_ticker !== 'None' && (
                            <div className="space-y-4">
                                <h3 className="text-xl font-bold text-white border-b border-slate-700 pb-2">Stock vs Metal ({metal})</h3>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 animate-fade-in">
                                    {results.stock_results.map((data) => {
                                        const stockId = data.stock_id;
                                        if (data.error) return null;
                                        const correlation = data.correlation || 0;
                                        const corrColor = correlation > 0.7 ? 'text-emerald-400' : correlation < -0.7 ? 'text-red-400' : 'text-slate-400';
                                        return (
                                            <div key={stockId} className="glass-panel p-6 rounded-2xl">
                                                <div className="flex justify-between items-start mb-4 border-b border-slate-700 pb-4">
                                                    <div>
                                                        <h3 className="text-xl font-bold text-white">{stockId} <span className="text-slate-500 text-sm">vs</span> {metal}</h3>
                                                        <div className="mt-1"><span className="text-slate-400 text-sm">Correlation: </span><span className={`text-2xl font-bold ${corrColor}`}>{correlation.toFixed(4)}</span></div>
                                                    </div>
                                                </div>
                                                <CorrelationChart
                                                    data={data.data}
                                                    series1Name={`${stockId} Price`} series2Name={`${metal} Price`}
                                                    series1Key="stock_price" series2Key="metal_price"
                                                    title={`${stockId} vs ${metal}`}
                                                />
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {/* Stock vs Stock Results */}
                        {results && results.stock_vs_stock && results.stock_vs_stock.length > 0 && (
                            <div className="space-y-4">
                                <h3 className="text-xl font-bold text-white border-b border-slate-700 pb-2">Stock Comparison</h3>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 animate-fade-in">
                                    {results.stock_vs_stock.map((data, idx) => {
                                        const correlation = data.correlation;
                                        const corrColor = correlation > 0.7 ? 'text-emerald-400' : correlation < -0.7 ? 'text-red-400' : 'text-slate-400';
                                        return (
                                            <div key={idx} className="glass-panel p-6 rounded-2xl">
                                                <div className="flex justify-between items-start mb-4 border-b border-slate-700 pb-4">
                                                    <div>
                                                        <h3 className="text-xl font-bold text-white">{data.stock1} <span className="text-slate-500 text-sm">vs</span> {data.stock2}</h3>
                                                        <div className="mt-1"><span className="text-slate-400 text-sm">Correlation: </span><span className={`text-2xl font-bold ${corrColor}`}>{correlation.toFixed(4)}</span></div>
                                                    </div>
                                                </div>
                                                <CorrelationChart
                                                    data={data.data}
                                                    series1Name={`${data.stock1} Price`} series2Name={`${data.stock2} Price`}
                                                    series1Key="price1" series2Key="price2"
                                                    title={`${data.stock1} vs ${data.stock2}`}
                                                />
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };


        // --- Stock News Section ---
        const StockNewsSection = () => {
            const [watchlist, setWatchlist] = useState([]);
            const [newStockId, setNewStockId] = useState('');
            const [newsResults, setNewsResults] = useState(null);
            const [loading, setLoading] = useState(false);
            const [days, setDays] = useState(1);

            useEffect(() => {
                axios.get('/api/news-watchlist')
                    .then(res => setWatchlist(res.data.stocks || []))
                    .catch(() => {});
            }, []);

            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [watchlist, newsResults, loading]);

            const saveWatchlist = async (list) => {
                try {
                    await axios.post('/api/news-watchlist', { stocks: list });
                } catch (e) {
                    console.error('Failed to save watchlist', e);
                }
            };

            const handleAddStock = async () => {
                const id = newStockId.trim();
                if (!id || watchlist.some(s => s.id === id)) return;

                let name = id;
                try {
                    const res = await axios.get(`/api/stock-name/${id}`);
                    if (res.data.name) name = res.data.name;
                } catch (e) {}

                const newList = [...watchlist, { id, name }];
                setWatchlist(newList);
                setNewStockId('');
                saveWatchlist(newList);
            };

            const handleDeleteStock = (idx) => {
                const newList = watchlist.filter((_, i) => i !== idx);
                setWatchlist(newList);
                saveWatchlist(newList);
            };

            const handleFetchNews = async () => {
                if (watchlist.length === 0) return;
                setLoading(true);
                setNewsResults(null);
                try {
                    const res = await axios.post('/api/fetch-news', {
                        stock_ids: watchlist.map(s => s.id),
                        days
                    });
                    setNewsResults(res.data.results);
                } catch (e) {
                    console.error('Failed to fetch news', e);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="space-y-6">
                    <div className="glass-panel p-6 rounded-2xl">
                        <h3 className="text-lg font-semibold text-purple-400 mb-4 flex items-center gap-2">
                            <i data-lucide="newspaper" className="w-5 h-5"></i>
                            股票自選清單
                        </h3>

                        <div className="space-y-1 mb-4 max-h-64 overflow-y-auto">
                            {watchlist.map((stock, idx) => (
                                <div key={idx} className="flex items-center gap-3 py-1.5 px-2 rounded hover:bg-slate-800/40">
                                    <span className="font-mono text-blue-300 w-16 flex-shrink-0">{stock.id}</span>
                                    <span className="text-slate-300 text-sm">{stock.name !== stock.id ? stock.name : ''}</span>
                                    <button onClick={() => handleDeleteStock(idx)} className="ml-auto text-slate-600 hover:text-red-400 transition-colors flex-shrink-0">
                                        <i data-lucide="trash-2" className="w-4 h-4"></i>
                                    </button>
                                </div>
                            ))}
                            {watchlist.length === 0 && (
                                <p className="text-slate-500 text-sm py-2">尚無股票，請在下方新增</p>
                            )}
                        </div>

                        <div className="flex gap-2">
                            <input
                                type="text"
                                value={newStockId}
                                onChange={e => setNewStockId(e.target.value)}
                                onKeyDown={e => e.key === 'Enter' && handleAddStock()}
                                placeholder="輸入股票代號 (e.g. 2330, AAPL)"
                                className="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-white text-sm focus:outline-none focus:border-purple-500 transition-colors"
                            />
                            <button
                                onClick={handleAddStock}
                                className="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-lg text-sm font-semibold transition-colors flex items-center gap-1.5"
                            >
                                <i data-lucide="plus" className="w-4 h-4"></i>
                                新增
                            </button>
                        </div>

                        <div className="flex items-center gap-4 mt-4 pt-4 border-t border-slate-700 flex-wrap">
                            <div className="flex items-center gap-2 flex-wrap">
                                <span className="text-sm text-slate-400 flex-shrink-0">搜尋範圍：</span>
                                {[1, 3, 7, 14, 30].map(d => (
                                    <button
                                        key={d}
                                        onClick={() => setDays(d)}
                                        className={`px-2.5 py-1 text-xs rounded transition-colors ${days === d ? 'bg-purple-600 text-white' : 'bg-slate-700 text-slate-400 hover:text-white'}`}
                                    >
                                        {d}天
                                    </button>
                                ))}
                            </div>
                            <button
                                onClick={handleFetchNews}
                                disabled={loading || watchlist.length === 0}
