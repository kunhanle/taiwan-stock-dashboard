                                className="ml-auto bg-purple-600 hover:bg-purple-500 disabled:opacity-50 disabled:cursor-not-allowed text-white px-6 py-2 rounded-lg font-bold transition-all flex items-center gap-2"
                            >
                                {loading
                                    ? <><i data-lucide="loader" className="animate-spin w-4 h-4"></i> 讀取中...</>
                                    : <><i data-lucide="newspaper" className="w-4 h-4"></i> 讀取新聞</>
                                }
                            </button>
                        </div>
                    </div>

                    {loading && (
                        <div className="text-center py-12 text-slate-400 animate-pulse">
                            正在抓取新聞，請稍候⋯（依股票數量需要一段時間）
                        </div>
                    )}

                    {newsResults && !loading && (
                        <div className="space-y-4">
                            {watchlist.map(stock => {
                                const result = newsResults[stock.id];
                                if (!result) return null;
                                const displayName = (result.name && result.name !== stock.id) ? result.name : stock.name;
                                return (
                                    <div key={stock.id} className="glass-panel p-5 rounded-2xl">
                                        <div className="flex items-center gap-2 mb-3 pb-3 border-b border-slate-700">
                                            <span className="font-mono text-blue-400 font-bold">{stock.id}</span>
                                            {displayName && displayName !== stock.id && (
                                                <span className="text-slate-300 font-semibold">{displayName}</span>
                                            )}
                                            <span className="ml-auto text-xs text-slate-500 bg-slate-800 px-2 py-0.5 rounded-full">
                                                {result.articles.length} 篇
                                            </span>
                                        </div>
                                        {result.articles.length === 0 ? (
                                            <p className="text-slate-500 text-sm">未找到相關新聞</p>
                                        ) : (
                                            <ul className="space-y-1">
                                                {result.articles.map((article, idx) => (
                                                    <li key={idx} className="group">
                                                        <a
                                                            href={article.link}
                                                            target="_blank"
                                                            rel="noopener noreferrer"
                                                            className="flex items-start gap-2 hover:bg-slate-800/40 rounded-lg px-2 py-1.5 transition-colors"
                                                        >
                                                            <span className="text-slate-600 text-xs mt-1 flex-shrink-0">•</span>
                                                            <div className="min-w-0">
                                                                <span className="text-sm text-blue-300 group-hover:text-blue-200 group-hover:underline leading-snug block">
                                                                    {article.title}
                                                                </span>
                                                                {(article.source || article.date) && (
                                                                    <span className="text-xs text-slate-500 mt-0.5 block">
                                                                        {article.source}{article.source && article.date ? ' · ' : ''}{article.date}
                                                                    </span>
                                                                )}
                                                            </div>
                                                        </a>
                                                    </li>
                                                ))}
                                            </ul>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    )}
                </div>
            );
        };

        // --- Financials Tab ---
        const FIN_COLORS = {
            amber: '#f59e0b', blue: '#3b82f6', red: '#ef4444',
            green: '#22c55e', purple: '#a855f7', orange: '#f97316', price: '#f87171',
        };
        const FIN_AXIS = { fill: '#94a3b8', fontSize: 11 };
        const FIN_GRID = { strokeDasharray: '3 3', stroke: 'rgba(255,255,255,0.08)' };
        const FIN_LEGEND = { wrapperStyle: { fontSize: 11, color: '#94a3b8', paddingTop: 4 } };
        const CHART_H = 280;

        const FinTooltip = ({ active, payload, label }) => {
            if (!active || !payload?.length) return null;
            return (
                <div style={{ background: '#1e293b', border: '1px solid rgba(255,255,255,0.15)', borderRadius: 8, padding: '0.5rem 0.75rem', fontSize: '0.78rem' }}>
                    <p style={{ margin: '0 0 0.3rem', color: '#94a3b8' }}>{label}</p>
                    {payload.map(p => (
                        <p key={p.dataKey} style={{ margin: '0.1rem 0', color: p.color }}>
                            {p.name}: {typeof p.value === 'number' ? p.value.toFixed(2) : p.value}
                        </p>
                    ))}
                </div>
            );
        };

        const FinCard = ({ title, children, loading, error, extra }) => (
            <div style={{ background: 'rgba(30,41,59,0.7)', border: '1px solid rgba(255,255,255,0.1)', borderRadius: 12, padding: '1rem' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '0.6rem' }}>
                    <h3 style={{ margin: 0, fontSize: '0.9rem', color: '#e2e8f0', fontWeight: 600 }}>{title}</h3>
                    {extra}
                </div>
                {loading ? (
                    <div style={{ height: CHART_H, display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#64748b' }}>載入中…</div>
                ) : error ? (
                    <div style={{ height: CHART_H, display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#ef4444', fontSize: '0.8rem', textAlign: 'center', padding: '0 1rem' }}>{error}</div>
                ) : children}
            </div>
        );

        const FinEmpty = () => (
            <div style={{ height: CHART_H, display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#475569', fontSize: '0.85rem' }}>
                輸入股號後點擊「顯示」
            </div>
        );

        const initC = () => ({ data: [], loading: false, error: null });

        const FinancialsTab = () => {
            const [inputId, setInputId]   = useState('');
            const [stockId, setStockId]   = useState('');
            const [stockName, setStockName] = useState('');
            const [years, setYears]         = useState(3);
            const [minShares, setMinShares]     = useState(400);
            const [pendingShares, setPendingShares] = useState(400);
            const [charts, setCharts] = useState({
                revenue: initC(), eps: initC(), margins: initC(),
                revGrowth: initC(), turnover: initC(), contractLiab: initC(), shareholders: initC(),
            });

            const setC = (key, u) => setCharts(prev => ({ ...prev, [key]: { ...prev[key], ...u } }));

            const fetchC = async (key, path, id, yrs, extra = '') => {
                setC(key, { loading: true, error: null, data: [] });
                try {
                    const sep = extra.startsWith('?') ? extra : (extra ? '?' + extra : '');
                    const qs = `?years=${yrs}` + (sep.startsWith('?') ? '&' + sep.slice(1) : sep);
                    const res = await fetch(`/api/financials/${id}/${path}${qs}`);
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    const json = await res.json();
                    if (json.error) throw new Error(json.error);
                    setC(key, { data: json.data ?? [], loading: false });
                } catch (e) {
                    setC(key, { error: e.message, loading: false, data: [] });
                }
            };

            const fetchAll = (id, yrs, shares) => {
                fetchC('revenue',      'revenue',              id, yrs);
                fetchC('eps',          'eps',                  id, yrs);
                fetchC('margins',      'margins',              id, yrs);
                fetchC('revGrowth',    'revenue-growth',       id, yrs);
                fetchC('turnover',     'turnover-days',        id, yrs);
                fetchC('contractLiab', 'contract-liabilities', id, yrs);
                fetchC('shareholders', 'shareholders',         id, yrs, `?min_shares=${shares}`);
            };

            const handleSearch = () => {
                const id = inputId.trim();
                if (!id) return;
                setStockId(id);
                setStockName('');
                fetch(`/api/financials/${id}/info`)
                    .then(r => r.json())
                    .then(j => setStockName(j.name || ''))
                    .catch(() => {});
                fetchAll(id, years, minShares);
            };

            const handleYears = (y) => {
                setYears(y);
                if (stockId) fetchAll(stockId, y, minShares);
            };

            const { revenue, eps, margins, revGrowth, turnover, contractLiab, shareholders } = charts;
            const fmtD = v => v ? String(v).slice(0, 7) : '';

            const yearBtnStyle = (y) => ({
                padding: '0.3rem 0.8rem', borderRadius: 6, fontSize: '0.85rem', fontWeight: 600,
                border: '1px solid rgba(255,255,255,0.15)', cursor: 'pointer', transition: 'all 0.15s',
                background: years === y ? '#3b82f6' : 'rgba(255,255,255,0.05)',
                color: years === y ? 'white' : '#94a3b8',
            });

            return (
                <div style={{ paddingBottom: '2rem' }}>
                    {/* Top bar: search + year range */}
                    <div style={{ display: 'flex', gap: '0.75rem', alignItems: 'center', marginBottom: '1.5rem', flexWrap: 'wrap' }}>
                        <input
                            type="text"
                            placeholder="輸入股號（例：2330）"
                            value={inputId}
                            onChange={e => setInputId(e.target.value)}
                            onKeyDown={e => e.key === 'Enter' && handleSearch()}
                            className="glass-panel"
                            style={{ padding: '0.6rem 1rem', borderRadius: 8, width: 200, color: 'white', fontSize: '1rem', border: '1px solid rgba(255,255,255,0.15)' }}
                        />
                        <button
                            onClick={handleSearch}
                            disabled={!inputId.trim()}
                            className="px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-semibold transition-colors disabled:opacity-40"
                        >
                            顯示
                        </button>
                        {/* Year range selector */}
                        <div style={{ display: 'flex', gap: '0.3rem', marginLeft: '0.5rem' }}>
                            {[1, 3, 5].map(y => (
                                <button key={y} onClick={() => handleYears(y)} style={yearBtnStyle(y)}>{y} 年</button>
                            ))}
                        </div>
                        {stockId && (
                            <span style={{ fontSize: '1rem', fontWeight: 700, color: '#e2e8f0' }}>
                                {stockId}{stockName ? <span style={{ color: '#94a3b8', fontWeight: 400 }}> {stockName}</span> : ''}
                            </span>
                        )}
                    </div>

                    {/* Grid */}
                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '1rem' }}>

                        {/* 1. Revenue */}
                        <FinCard title="每月營收 (億元)" loading={revenue.loading} error={revenue.error}>
                            {revenue.data.length > 0 ? (
                                <ResponsiveContainer width="100%" height={CHART_H}>
                                    <ComposedChart data={revenue.data}>
                                        <CartesianGrid {...FIN_GRID} />
                                        <XAxis dataKey="date" tick={FIN_AXIS} tickFormatter={fmtD} interval="preserveStartEnd" />
                                        <YAxis yAxisId="l" tick={FIN_AXIS} />
                                        <YAxis yAxisId="r" orientation="right" tick={FIN_AXIS} />
                                        <Tooltip content={<FinTooltip />} />
                                        <Legend {...FIN_LEGEND} />
                                        <Bar  yAxisId="l" dataKey="value" name="月營收(億)" fill="#38bdf8" opacity={0.85} />
                                        <Line yAxisId="r" dataKey="price" name="股價" stroke="#ef4444" dot={false} strokeWidth={2} />
                                    </ComposedChart>
                                </ResponsiveContainer>
                            ) : <FinEmpty />}
                        </FinCard>

                        {/* 2. EPS */}
                        <FinCard title="單季 EPS (元)" loading={eps.loading} error={eps.error}>
                            {eps.data.length > 0 ? (
                                <ResponsiveContainer width="100%" height={CHART_H}>
                                    <ComposedChart data={eps.data}>
                                        <CartesianGrid {...FIN_GRID} />
                                        <XAxis dataKey="date" tick={FIN_AXIS} />
                                        <YAxis yAxisId="l" tick={FIN_AXIS} />
                                        <YAxis yAxisId="r" orientation="right" tick={FIN_AXIS} />
                                        <Tooltip content={<FinTooltip />} />
                                        <Legend {...FIN_LEGEND} />
                                        <Bar  yAxisId="l" dataKey="value" name="EPS(元)" fill="#34d399" opacity={0.85} />
                                        <Line yAxisId="r" dataKey="price" name="股價" stroke="#ef4444" dot={false} strokeWidth={2} />
                                    </ComposedChart>
                                </ResponsiveContainer>
                            ) : <FinEmpty />}
                        </FinCard>

                        {/* 3. Margins */}
                        <FinCard title="利潤比率 (%)" loading={margins.loading} error={margins.error}>
                            {margins.data.length > 0 ? (
                                <ResponsiveContainer width="100%" height={CHART_H}>
                                    <LineChart data={margins.data}>
                                        <CartesianGrid {...FIN_GRID} />
                                        <XAxis dataKey="date" tick={FIN_AXIS} />
                                        <YAxis tick={FIN_AXIS} unit="%" />
                                        <Tooltip content={<FinTooltip />} />
                                        <Legend {...FIN_LEGEND} />
                                        <Line dataKey="gross_margin"     name="毛利率"    stroke={FIN_COLORS.amber}  dot={{ r: 3, fill: FIN_COLORS.amber,  strokeWidth: 0 }} strokeWidth={2} />
                                        <Line dataKey="operating_margin" name="營業利益率" stroke={FIN_COLORS.blue}   dot={{ r: 3, fill: FIN_COLORS.blue,   strokeWidth: 0 }} strokeWidth={2} />
                                        <Line dataKey="pre_tax_margin"   name="稅前淨利率" stroke={FIN_COLORS.red}    dot={{ r: 3, fill: FIN_COLORS.red,    strokeWidth: 0 }} strokeWidth={2} />
                                        <Line dataKey="net_margin"       name="稅後淨利率" stroke={FIN_COLORS.green}  dot={{ r: 3, fill: FIN_COLORS.green,  strokeWidth: 0 }} strokeWidth={2} />
                                    </LineChart>
                                </ResponsiveContainer>
                            ) : <FinEmpty />}
                        </FinCard>

                        {/* 4. Revenue Growth */}
                        <FinCard title="長短期月營收年增率 (%)" loading={revGrowth.loading} error={revGrowth.error}>
                            {revGrowth.data.length > 0 ? (
                                <ResponsiveContainer width="100%" height={CHART_H}>
                                    <ComposedChart data={revGrowth.data}>
                                        <CartesianGrid {...FIN_GRID} />
                                        <XAxis dataKey="date" tick={FIN_AXIS} tickFormatter={fmtD} interval="preserveStartEnd" />
                                        <YAxis yAxisId="l" tick={FIN_AXIS} unit="%" />
                                        <YAxis yAxisId="r" orientation="right" tick={FIN_AXIS} />
                                        <ReferenceLine yAxisId="l" y={0} stroke="rgba(255,255,255,0.2)" />
                                        <Tooltip content={<FinTooltip />} />
                                        <Legend {...FIN_LEGEND} />
                                        <Line yAxisId="l" dataKey="rev3_yoy"  name="近3月"  stroke="#fbbf24" dot={{ r: 3, fill: '#fbbf24', strokeWidth: 0 }} strokeWidth={2} />
                                        <Line yAxisId="l" dataKey="rev6_yoy"  name="近6月"  stroke="#22d3ee" dot={{ r: 3, fill: '#22d3ee', strokeWidth: 0 }} strokeWidth={2} />
                                        <Line yAxisId="l" dataKey="rev12_yoy" name="近12月" stroke="#86efac" dot={{ r: 3, fill: '#86efac', strokeWidth: 0 }} strokeWidth={2} />
                                        <Line yAxisId="r" dataKey="price"     name="股價"   stroke="#ef4444" dot={false} strokeWidth={2} />
                                    </ComposedChart>
                                </ResponsiveContainer>
                            ) : <FinEmpty />}
                        </FinCard>

                        {/* 5. Turnover Days */}
                        <FinCard title="週轉天數 (天)" loading={turnover.loading} error={turnover.error}>
                            {turnover.data.length > 0 ? (
                                <ResponsiveContainer width="100%" height={CHART_H}>
                                    <LineChart data={turnover.data}>
                                        <CartesianGrid {...FIN_GRID} />
                                        <XAxis dataKey="date" tick={FIN_AXIS} />
                                        <YAxis tick={FIN_AXIS} unit="天" />
                                        <Tooltip content={<FinTooltip />} />
                                        <Legend {...FIN_LEGEND} />
                                        <Line dataKey="dso"             name="應收帳款收現天數" stroke={FIN_COLORS.amber}  dot={{ r: 3, fill: FIN_COLORS.amber, strokeWidth: 0 }} strokeWidth={2} />
                                        <Line dataKey="dio"             name="存貨週轉天數"     stroke={FIN_COLORS.blue}   dot={{ r: 3, fill: FIN_COLORS.blue,  strokeWidth: 0 }} strokeWidth={2} />
                                        <Line dataKey="operating_cycle" name="營業週轉天數"     stroke={FIN_COLORS.red}    dot={{ r: 3, fill: FIN_COLORS.red,   strokeWidth: 0 }} strokeWidth={2} />
                                    </LineChart>
                                </ResponsiveContainer>
                            ) : <FinEmpty />}
                        </FinCard>

                        {/* 6. Contract Liabilities */}
                        <FinCard title="合約負債 (億元) 及佔營收比例" loading={contractLiab.loading} error={contractLiab.error}>
                            {contractLiab.data.length > 0 ? (
                                <ResponsiveContainer width="100%" height={CHART_H}>
                                    <ComposedChart data={contractLiab.data}>
                                        <CartesianGrid {...FIN_GRID} />
                                        <XAxis dataKey="date" tick={FIN_AXIS} />
                                        <YAxis yAxisId="l" tick={FIN_AXIS} unit="億" />
                                        <YAxis yAxisId="r" orientation="right" tick={FIN_AXIS} unit="%" />
                                        <Tooltip content={<FinTooltip />} />
                                        <Legend {...FIN_LEGEND} />
                                        <Bar  yAxisId="l" dataKey="cl_bn"  name="合約負債(億)" fill="#818cf8" opacity={0.85} />
                                        <Line yAxisId="r" dataKey="ratio"  name="佔營收%" stroke="#f472b6" dot={{ r: 3, fill: '#f472b6', strokeWidth: 0 }} strokeWidth={2} />
                                    </ComposedChart>
                                </ResponsiveContainer>
                            ) : <FinEmpty />}
                        </FinCard>

                        {/* 7. Shareholders */}
                        <FinCard
                            title="大股東持股比率 (%)"
                            loading={shareholders.loading}
                            error={shareholders.error}
                            extra={
                                <div style={{ display: 'flex', gap: '0.4rem', alignItems: 'center' }}>
                                    <span style={{ fontSize: '0.78rem', color: '#94a3b8' }}>大股東定義≥</span>
                                    <select
                                        value={pendingShares}
                                        onChange={e => {
                                            const v = Number(e.target.value);
                                            setPendingShares(v);
                                            if (stockId) {
                                                setMinShares(v);
                                                fetchC('shareholders', 'shareholders', stockId, years, `?min_shares=${v}`);
                                            }
                                        }}
                                        disabled={!stockId}
                                        style={{ padding: '0.2rem 0.4rem', borderRadius: 4, fontSize: '0.8rem', border: '1px solid rgba(255,255,255,0.15)', background: '#1e293b', color: 'white', cursor: 'pointer' }}
                                    >
                                        <option value={200}>200 張</option>
                                        <option value={400}>400 張</option>
                                        <option value={600}>600 張</option>
                                        <option value={800}>800 張</option>
                                        <option value={1000}>1000 張</option>
                                    </select>
                                </div>
                            }
                        >
                            {shareholders.data.length > 0 ? (
                                <ResponsiveContainer width="100%" height={CHART_H}>
                                    <ComposedChart data={shareholders.data}>
                                        <CartesianGrid {...FIN_GRID} />
                                        <XAxis dataKey="date" tick={FIN_AXIS} tickFormatter={fmtD} interval="preserveStartEnd" />
                                        <YAxis yAxisId="l" tick={FIN_AXIS} unit="%" domain={['auto', 'auto']} />
                                        <YAxis yAxisId="r" orientation="right" tick={FIN_AXIS} />
                                        <Tooltip content={<FinTooltip />} />
                                        <Legend {...FIN_LEGEND} />
                                        <Line yAxisId="l" dataKey="value" name="大股東持股%" stroke={FIN_COLORS.amber} dot={false} strokeWidth={2} />
                                        <Line yAxisId="r" dataKey="price" name="股價"        stroke={FIN_COLORS.price} dot={false} strokeWidth={1.5} />
                                    </ComposedChart>
                                </ResponsiveContainer>
                            ) : <FinEmpty />}
                        </FinCard>

                    </div>
                </div>
            );
        };

        // --- US-TW Linkage View (A price read-through + B revenue linkage) ---
        const LK_VERDICT = {
            "tradeable+fundamental": { label: "可交易+基本面", cls: "bg-emerald-500/15 text-emerald-300 border-emerald-500/40" },
            "fundamental-only": { label: "僅基本面", cls: "bg-blue-500/15 text-blue-300 border-blue-500/40" },
            "tradeable-only": { label: "僅可交易(題材)", cls: "bg-amber-500/15 text-amber-300 border-amber-500/40" },
            "semi-cycle": { label: "半導體景氣", cls: "bg-slate-500/15 text-slate-300 border-slate-500/40" },
            "weak": { label: "弱", cls: "bg-slate-600/10 text-slate-500 border-slate-600/30" },
        };
        const lkFmt = (x) => (x === null || x === undefined) ? "—" : (x >= 0 ? "+" : "") + x.toFixed(2);
        const lkPct = (x) => (x === null || x === undefined) ? "—" : (x >= 0 ? "+" : "") + (x * 100).toFixed(1) + "%";
        const LK_ROLE = {
            up: "上游：台股供應進此美股主題（賣方）",
            down: "下游：台股位於此美股主題的下游（買方/組裝）",
            peer: "同業：與美股同層的全球競爭者",
            dual: "雙重掛牌：與美股 ADR 同一家公司",
        };

        const LinkageView = () => {
            const [cats, setCats] = useState([]);
            const [slug, setSlug] = useState(null);
            const [data, setData] = useState(null);
            const [loading, setLoading] = useState(false);
            const [twId, setTwId] = useState("");
            const [rev, setRev] = useState(null);
            const [alerts, setAlerts] = useState(null);
            const [overview, setOverview] = useState(null);
            const [obench, setObench] = useState('all');
            const [alertsOpen, setAlertsOpen] = useState(false);

            useEffect(() => { axios.get('/api/linkage/categories').then(r => setCats(r.data)).catch(() => { }); }, []);
            useEffect(() => { axios.get('/api/linkage/alerts').then(r => setAlerts(r.data)).catch(() => setAlerts({ ready: false })); }, []);
            useEffect(() => { axios.get('/api/linkage/overview').then(r => setOverview(r.data)).catch(() => setOverview({ ready: false })); }, []);
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [data, cats, rev, loading, overview, alertsOpen]);

            const load = async (s) => {
                setSlug(s); setLoading(true); setData(null);
                try { const r = await axios.get(`/api/linkage/category/${s}`); setData(r.data); }
                catch (e) { setData({ error: true }); }
                setLoading(false);
            };
            const lookup = async () => {
                const id = twId.trim(); if (!id) return; setRev({ loading: true });
                try { const r = await axios.get(`/api/linkage/stock/${id}`); setRev(r.data); }
                catch (e) { setRev({ error: true }); }
            };

            const byCluster = useMemo(() => {
                const m = {}; cats.forEach(c => { (m[c.cluster] = m[c.cluster] || []).push(c); }); return m;
            }, [cats]);

            return (
                <div className="space-y-6">
                    <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                        <div>
                            <h2 className="text-xl font-bold text-white border-l-4 border-teal-500 pl-4">全球連動 (Global ↔ TW Linkage)</h2>
                            <p className="text-sm text-slate-400 pl-5 mt-1">美/中/日/韓/歐龍頭 ↔ 台股兩層連動。A 層=股價讀數(短線)，B 層=營收 YoY(景氣)。判定見下方圖例。</p>
                        </div>
                        <div className="glass-panel rounded-xl px-3 py-2 flex items-center gap-2">
                            <i data-lucide="search" className="w-4 h-4 text-teal-400"></i>
                            <input value={twId} onChange={e => setTwId(e.target.value)} onKeyDown={e => e.key === 'Enter' && lookup()}
                                placeholder="台股反查 e.g. 2327" className="bg-transparent text-sm text-slate-200 outline-none w-28 placeholder-slate-500" />
                            <button onClick={lookup} className="text-xs px-2 py-1 rounded bg-slate-700 text-teal-300 hover:bg-slate-600">查</button>
                        </div>
                    </div>

                    {/* verdict + role legend */}
                    <div className="pl-5 space-y-2">
                        <div className="flex flex-wrap items-center gap-2">
                            <span className="text-xs text-slate-500">判定:</span>
                            {Object.entries(LK_VERDICT).map(([k, v]) => (
                                <span key={k} className={`text-xs px-2 py-0.5 rounded-full border ${v.cls}`}>{v.label}</span>
                            ))}
                        </div>
                        <div className="flex flex-wrap items-center gap-x-4 gap-y-1 text-xs text-slate-500">
                            <span>角色:</span>
                            {Object.entries(LK_ROLE).map(([k, v]) => (
                                <span key={k}><b className="text-slate-400">{k}</b> {v.split("：")[1]}</span>
                            ))}
                        </div>
                    </div>

                    {/* Alert: relative-strength breakouts (collapsible, default collapsed) */}
                    {alerts && alerts.ready && alerts.alerts.length > 0 && (
                        <section className="glass-panel rounded-2xl p-4 border border-amber-500/30">
                            <button onClick={() => setAlertsOpen(o => !o)}
                                className="w-full flex items-center gap-2 text-left">
                                <i data-lucide="zap" className="w-4 h-4 text-amber-400"></i>
                                <span className="text-sm font-semibold text-amber-300">相對強度警示</span>
                                <span className="text-xs px-1.5 py-0.5 rounded-full bg-amber-500/20 text-amber-300">{alerts.alerts.length}</span>
                                <span className="text-xs text-slate-500 hidden sm:inline">≥2 檔美股族群超漲贏基準（單一美股不列入，見下方排行榜）</span>
                                <i data-lucide={alertsOpen ? "chevron-up" : "chevron-down"} className="w-4 h-4 text-slate-400 ml-auto"></i>
                            </button>
                            {alertsOpen && (
                                <div className="space-y-2 mt-3">
                                    {alerts.alerts.map(a => (
                                        <button key={a.slug} onClick={() => load(a.slug)}
                                            className="w-full text-left flex flex-wrap items-center gap-x-3 gap-y-1 px-3 py-2 rounded-lg bg-slate-800/60 border border-slate-700 hover:border-amber-500">
                                            <span className="text-amber-300 font-semibold text-sm">超額 {lkPct(a.excess)}</span>
                                            <span className="text-slate-200 text-sm">{a.name_zh}</span>
                                            <span className="text-xs text-slate-500">族群{lkPct(a.a_move)} vs {a.benchmark === '^SOX' ? '費半' : (a.benchmark === 'QQQ' ? '科技' : '大盤')}{lkPct(a.benchmark_move)}</span>
                                            {a.watch.length > 0 && <span className="text-xs text-teal-400">→ 留意 {a.watch.map(w => w.name.split(' ')[0]).slice(0, 3).join('、')}</span>}
                                        </button>
                                    ))}
                                </div>
                            )}
                        </section>
                    )}
                    {alerts && alerts.ready && alerts.alerts.length === 0 && (
                        <div className="pl-5 text-xs text-slate-500">目前無相對強度警示（沒有族群明顯超漲贏大盤）。</div>
                    )}

                    {/* Cross-category relative-strength leaderboard */}
                    {overview && overview.ready && (
                        <section className="glass-panel rounded-2xl p-4">
                            <div className="flex flex-wrap items-center gap-2 mb-3">
                                <i data-lucide="bar-chart-3" className="w-4 h-4 text-teal-400"></i>
                                <span className="text-sm font-semibold text-teal-300">跨類別相對強度排行</span>
                                <span className="text-xs text-slate-500">全 {overview.categories.length} 類依超額排序（點列查兩層明細）</span>
                                {overview.generated_at && <span className="text-xs text-slate-600" title="快照資料時間，反映最近一個美股「收盤」session，非即時盤中價">資料: {new Date(overview.generated_at).toLocaleString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })}（美股收盤快照）</span>}
                                <div className="flex gap-1 ml-auto">
                                    {[['all', '全部'], ['^SOX', '費半'], ['QQQ', '科技'], ['^GSPC', '大盤']].map(([k, lbl]) => (
                                        <button key={k} onClick={() => setObench(k)}
                                            className={`text-xs px-2 py-0.5 rounded border ${obench === k ? 'bg-teal-600/20 border-teal-500 text-teal-200' : 'border-slate-700 text-slate-400 hover:border-slate-500'}`}>{lbl}</button>
                                    ))}
                                </div>
                            </div>
                            <div className="overflow-x-auto max-h-96 overflow-y-auto">
                                <table className="w-full text-sm">
                                    <thead className="sticky top-0 bg-slate-900/95"><tr className="text-slate-400 border-b border-slate-700">
                                        <th className="text-left py-1.5 font-medium">類別</th>
                                        <th className="text-center font-medium">基準</th>
                                        <th className="text-right font-medium">族群%</th>
                                        <th className="text-right font-medium">超額%</th>
                                        <th className="text-left font-medium pl-3">領頭台股(讀數)</th>
                                    </tr></thead>
                                    <tbody>
                                        {overview.categories.filter(c => obench === 'all' || (obench === '^GSPC' ? (c.benchmark === '^GSPC' || !c.benchmark) : c.benchmark === obench)).map(c => {
                                            const tier = c.benchmark === '^SOX' ? '費半' : (c.benchmark === 'QQQ' ? '科技' : (c.benchmark === '^GSPC' ? '大盤' : '—'));
                                            return (
                                                <tr key={c.slug} onClick={() => load(c.slug)}
                                                    className={`border-b border-slate-800/60 cursor-pointer hover:bg-slate-800/40 ${slug === c.slug ? 'bg-teal-600/10' : ''}`}>
                                                    <td className="py-1.5 text-slate-200">{c.name_zh} <span className="text-slate-600 text-xs">{c.cluster}</span></td>
                                                    <td className="text-center text-xs text-slate-400">{tier}</td>
                                                    <td className={`text-right tabular-nums ${(c.a_move || 0) >= 0 ? 'text-red-400' : 'text-green-400'}`}>{c.a_move == null ? '—' : lkPct(c.a_move)}</td>
                                                    <td className={`text-right tabular-nums font-semibold ${c.excess == null ? 'text-slate-600' : (c.excess >= 0.03 ? 'text-amber-300' : (c.excess >= 0 ? 'text-slate-300' : 'text-green-400'))}`}>{c.excess == null ? '—' : lkPct(c.excess)}{c.us_count === 1 && c.excess != null && <span className="ml-1 text-[10px] text-slate-500" title="單一美股籃子，超額易受個股雜訊影響">單</span>}</td>
                                                    <td className="text-left pl-3 text-xs text-slate-400">{c.top_node ? `${c.top_node.name.split(' ')[0]} ${c.top_node.readthrough.toFixed(3)}` : (c.has_trigger ? '—' : '純台股')}</td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        </section>
                    )}

                    {/* reverse lookup result */}
                    {rev && (
                        <section className="glass-panel rounded-2xl p-4">
                            {rev.loading ? <span className="text-slate-400 text-sm">查詢中…</span> :
                                rev.error || !rev.drivers ? <span className="text-slate-500 text-sm">查無此台股的連動（或非清單內）。</span> :
                                    <div>
                                        <div className="text-sm text-slate-300 mb-2">台股 <span className="text-teal-300 font-semibold">{rev.tw_id}</span> 被這些美股主題驅動：</div>
                                        <div className="flex flex-wrap gap-2">
                                            {rev.drivers.map(d => (
                                                <button key={d.slug} onClick={() => load(d.slug)}
                                                    className="text-xs px-2 py-1 rounded bg-slate-800 border border-slate-700 text-slate-300 hover:border-teal-500">
                                                    {d.name_zh} · 讀數{lkFmt(d.readthrough)}</button>
                                            ))}
                                        </div>
                                    </div>}
                        </section>
                    )}

                    {/* category picker grouped by cluster */}
                    <section className="glass-panel rounded-2xl p-4 space-y-3">
                        {Object.keys(byCluster).map(cl => (
                            <div key={cl}>
                                <div className="text-xs uppercase tracking-wide text-slate-500 mb-1">{cl}</div>
                                <div className="flex flex-wrap gap-2">
                                    {byCluster[cl].map(c => (
                                        <button key={c.slug} onClick={() => load(c.slug)}
                                            className={`text-xs px-2.5 py-1 rounded-lg border transition-colors ${slug === c.slug ? "bg-teal-600/20 border-teal-500 text-teal-200" : "bg-slate-800/60 border-slate-700 text-slate-300 hover:border-slate-500"}`}>
                                            {c.name_zh}</button>
                                    ))}
                                </div>
                            </div>
                        ))}
                    </section>

                    {loading && <div className="text-center text-slate-400 py-8"><i data-lucide="loader" className="w-6 h-6 animate-spin inline"></i><div className="text-sm mt-2">計算兩層連動中…(首次較慢)</div></div>}

                    {data && !data.error && (
                        <section className="glass-panel rounded-2xl p-6 space-y-4">
                            <div className="flex flex-wrap items-baseline gap-x-6 gap-y-1">
                                <h3 className="text-lg font-semibold text-white">{data.name_zh} <span className="text-slate-500 text-sm">[{data.cluster}]</span></h3>
                                <span className="text-sm text-slate-300">族群 5日: <b className={data.a_move >= 0 ? "text-red-400" : "text-green-400"}>{lkPct(data.a_move)}</b> (z {lkFmt(data.a_z)})</span>
                                {data.excess !== null && data.excess !== undefined && (
                                    <span className="text-sm text-slate-300">相對{data.benchmark === '^SOX' ? '費半' : (data.benchmark === 'QQQ' ? '科技(QQQ)' : '大盤')}: <b className={data.excess >= 0.03 ? "text-amber-300" : (data.excess >= 0 ? "text-slate-200" : "text-green-400")}>超額 {lkPct(data.excess)}</b></span>
                                )}
                                <span className="text-sm text-slate-300">美股營收YoY: <b className="text-slate-100">{lkPct(data.us_yoy_latest)}</b></span>
                                <span className="text-sm text-slate-400">US 覆蓋 {data.us_coverage}{data.us_missing && data.us_missing.length ? ` (缺 ${data.us_missing.join(",")})` : ""}</span>
                            </div>

                            {/* US basket members */}
                            {data.us_members && data.us_members.length > 0 && (
                                <div>
                                    <div className="text-xs uppercase tracking-wide text-slate-500 mb-2">美股龍頭（觸發籃）</div>
                                    <div className="flex flex-wrap gap-2">
                                        {data.us_members.map(m => (
                                            <div key={m.ticker} className="px-3 py-1.5 rounded-lg bg-slate-800/60 border border-slate-700 text-sm">
                                                <span className="text-slate-200 font-medium">{m.ticker}</span>
                                                <span className={`ml-2 ${(m.move || 0) >= 0 ? "text-red-400" : "text-green-400"}`}>{lkPct(m.move)}</span>
                                                <span className="ml-2 text-xs text-slate-500">營收{lkPct(m.rev_yoy)}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            <div className="text-xs uppercase tracking-wide text-slate-500">台股連動節點</div>
                            {data.nodes.length === 0 ? (
                                <div className="text-sm text-slate-500 py-3 px-1 border border-dashed border-slate-700 rounded-lg">
                                    此類無台股對應 — 僅追蹤國際龍頭籃子的漲跌與相對強度，用以判讀該產業景氣方向。
                                </div>
                            ) : (
                            <div className="overflow-x-auto">
                                <table className="w-full text-sm">
                                    <thead><tr className="text-slate-400 border-b border-slate-700">
                                        <th className="text-left py-2 font-medium">台股</th>
                                        <th className="text-center font-medium">角色</th>
                                        <th className="text-right font-medium">A 股價</th>
                                        <th className="text-right font-medium">讀數</th>
                                        <th className="text-right font-medium">B 營收</th>
                                        <th className="text-center font-medium">領先/落後</th>
                                        <th className="text-right font-medium">判定</th>
                                    </tr></thead>
                                    <tbody>
                                        {data.nodes.map(n => {
                                            const v = LK_VERDICT[n.verdict] || LK_VERDICT.weak;
                                            return (
                                                <tr key={n.ticker} className="border-b border-slate-800/60">
                                                    <td className="py-2 text-slate-200"><span className="text-slate-500 mr-1">{n.ticker}</span>{n.name}</td>
                                                    <td className="text-center text-slate-400 text-xs">{n.role}</td>
                                                    <td className="text-right tabular-nums text-slate-300">{lkFmt(n.a_corr)}</td>
                                                    <td className="text-right tabular-nums text-slate-400">{n.readthrough == null ? "—" : n.readthrough.toFixed(3)}</td>
                                                    <td className="text-right tabular-nums text-slate-300">{lkFmt(n.b_corr)}</td>
                                                    <td className="text-center text-xs text-slate-400">{n.lead_lag ? (n.lead_lag > 0 ? `落後${n.lead_lag}季` : `領先${-n.lead_lag}季`) : "同步"}</td>
                                                    <td className="text-right"><span className={`text-xs px-2 py-0.5 rounded-full border ${v.cls}`}>{v.label}</span></td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                            )}
                        </section>
                    )}
                    {data && data.error && <div className="text-center text-red-400 py-6 text-sm">載入失敗</div>}
                    {!slug && !loading && <div className="text-center text-slate-500 py-8 text-sm">選一個類別查看美↔台兩層連動</div>}
                </div>
            );
        };

        // --- App ---
        const App = () => {
            const [view, setView] = useState("dashboard"); // dashboard | detail
            const [selectedCategory, setSelectedCategory] = useState(null);
            const [activeTab, setActiveTab] = useState("market"); // market | category

            // Market Data
            const [historyData, setHistoryData] = useState([]);
            const [distData, setDistData] = useState(null);

            // Category Data
            const [catStats, setCatStats] = useState(null);
            const [selectedDate, setSelectedDate] = useState(null);
            const [availableDates, setAvailableDates] = useState([]);

            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const loadAll = async () => {
                    const [mkt, cat] = await Promise.all([fetchMarketData(), fetchCategoryStats()]);
                    setHistoryData(mkt.history || []);
                    setDistData(mkt.distribution);
                    setCatStats(cat);
                    if (cat && cat.available_dates) {
                        setAvailableDates(cat.available_dates);
                    }
                    setLoading(false);
                };
                loadAll();
            }, []);

            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [loading, view, activeTab]);

            const recentData = useMemo(() => {
                if (historyData.length === 0) return [];
                return historyData.slice(-250);
            }, [historyData]);

            const handleSelectCategory = (name) => {
                setSelectedCategory(name);
                setView("detail");
                window.scrollTo(0, 0);
            };

            const handleDateChange = async (dateStr) => {
                setSelectedDate(dateStr);
                const cat = await fetchCategoryStats(dateStr);
                setCatStats(cat);
            };

            return (
                <div className="min-h-screen pb-10">
                    <header className="glass-panel sticky top-0 z-50 mb-8 border-b border-slate-700">
                        <div className="container mx-auto px-6 py-4 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <i data-lucide="layout-dashboard" className="text-blue-400 w-6 h-6"></i>
                                <h1 className="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-cyan-300">
                                    Taiwan Stock Monitor
                                </h1>
                            </div>
                            <div className="text-sm text-slate-400">
                                {loading ? "Connecting..." : (
                                    view === "dashboard" ? `Market Overview` : `Detail View`
                                )}
                            </div>
                        </div>
                    </header>

                    <main className="container mx-auto px-4 md:px-6 space-y-8">
                        {loading ? (
                            <div className="flex items-center justify-center h-64 text-slate-500 animate-pulse">Loading Data...</div>
                        ) : view === "detail" ? (
                            <CategoryDetailView category={selectedCategory} onBack={() => setView("dashboard")} />
                        ) : (
                            <>
                                {/* Tab Navigation */}
                                <div className="flex space-x-4 border-b border-slate-700 pb-2 mb-6">
                                    <button
                                        onClick={() => setActiveTab("market")}
                                        className={`px-4 py-2 rounded-lg transition-colors ${activeTab === "market" ? "bg-slate-700 text-blue-400 font-semibold" : "text-slate-400 hover:text-slate-200 hover:bg-slate-800/50"}`}
                                    >
                                        市場廣度
                                    </button>
                                    <button
                                        onClick={() => setActiveTab("category")}
                                        className={`px-4 py-2 rounded-lg transition-colors ${activeTab === "category" ? "bg-slate-700 text-blue-400 font-semibold" : "text-slate-400 hover:text-slate-200 hover:bg-slate-800/50"}`}
                                    >
                                        類股分析
                                    </button>
                                    <button
                                        onClick={() => setActiveTab("levels")}
                                        className={`px-4 py-2 rounded-lg transition-colors ${activeTab === "levels" ? "bg-slate-700 text-blue-400 font-semibold" : "text-slate-400 hover:text-slate-200 hover:bg-slate-800/50"}`}
                                    >
                                        自訂價位
                                    </button>
                                    <button
                                        onClick={() => setActiveTab("financials")}
                                        className={`px-4 py-2 rounded-lg transition-colors ${activeTab === "financials" ? "bg-slate-700 text-yellow-400 font-semibold" : "text-slate-400 hover:text-slate-200 hover:bg-slate-800/50"}`}
                                    >
                                        財務報表
                                    </button>
                                    <button
                                        onClick={() => setActiveTab("news")}
                                        className={`px-4 py-2 rounded-lg transition-colors ${activeTab === "news" ? "bg-slate-700 text-purple-400 font-semibold" : "text-slate-400 hover:text-slate-200 hover:bg-slate-800/50"}`}
                                    >
                                        新聞
                                    </button>
                                    <button
                                        onClick={() => setActiveTab("correlation")}
                                        className={`px-4 py-2 rounded-lg transition-colors ${activeTab === "correlation" ? "bg-slate-700 text-blue-400 font-semibold" : "text-slate-400 hover:text-slate-200 hover:bg-slate-800/50"}`}
                                    >
                                        相關性分析
                                    </button>
                                    <button
                                        onClick={() => setActiveTab("linkage")}
                                        className={`px-4 py-2 rounded-lg transition-colors ${activeTab === "linkage" ? "bg-slate-700 text-teal-400 font-semibold" : "text-slate-400 hover:text-slate-200 hover:bg-slate-800/50"}`}
                                    >
                                        全球連動
                                    </button>
                                </div>


                                {/* Financials Section */}
                                <div className={activeTab === 'financials' ? 'block' : 'hidden'}>
                                    <FinancialsTab />
                                </div>

                                {/* US-TW Linkage Section */}
                                <div className={activeTab === 'linkage' ? 'block' : 'hidden'}>
                                    <LinkageView />
                                </div>

                                {/* Market Breadth Section */}
                                <div className={activeTab === 'market' ? 'space-y-6 block' : 'hidden'}>
                                    <h2 className="text-xl font-bold text-white border-l-4 border-blue-500 pl-4">Market Breadth</h2>
                                    <div className="grid md:grid-cols-2 gap-6">
                                        <section className="glass-panel rounded-2xl p-6">
                                            <div className="mb-6"><h2 className="text-lg font-semibold text-slate-200 flex items-center gap-2"><i data-lucide="trending-up" className="text-red-400 w-5 h-5"></i>一年新高 vs 一年新低 (Within 5%)</h2></div>
                                            <HighLowChart data={recentData} />
                                        </section>
                                        <section className="glass-panel rounded-2xl p-6">
                                            <div className="mb-6"><h2 className="text-lg font-semibold text-slate-200 flex items-center gap-2"><i data-lucide="bar-chart" className="text-yellow-400 w-5 h-5"></i>Daily Price Change Dist.</h2></div>
                                            {distData && <DistributionChart data={distData.data} date={distData.date} />}
                                        </section>
                                    </div>
                                    <div className="grid md:grid-cols-2 gap-6">
                                        <section className="glass-panel rounded-2xl p-6">
                                            <div className="mb-6"><h2 className="text-lg font-semibold text-slate-200 flex items-center gap-2"><i data-lucide="activity" className="text-blue-400 w-5 h-5"></i>季線上 vs 下 (13-Week MA)</h2></div>
                                            <MAShadedChart data={recentData} keyAbove="above_13w_ma" keyBelow="below_13w_ma" title1="> 13w MA" title2="< 13w MA" colorAbove="#60a5fa" colorBelow="#94a3b8" />
                                        </section>
                                        <section className="glass-panel rounded-2xl p-6">
                                            <div className="mb-6"><h2 className="text-lg font-semibold text-slate-200 flex items-center gap-2"><i data-lucide="bar-chart-2" className="text-purple-400 w-5 h-5"></i>年線上 vs 下 (52-Week MA)</h2></div>
                                            <MAShadedChart data={recentData} keyAbove="above_52w_ma" keyBelow="below_52w_ma" title1="> 52w MA" title2="< 52w MA" colorAbove="#c084fc" colorBelow="#94a3b8" />
                                        </section>
                                    </div>
                                    <section className="glass-panel rounded-2xl p-6">
                                        <div className="mb-6"><h2 className="text-lg font-semibold text-slate-200 flex items-center gap-2"><i data-lucide="alert-triangle" className="text-orange-400 w-5 h-5"></i>融資維持率 (Maintenance Ratio - 2 Years)</h2></div>
                                        <MaintenanceRatioChart data={historyData} />
                                    </section>
                                    <section className="glass-panel rounded-2xl p-6">
                                        <div className="mb-6"><h2 className="text-lg font-semibold text-slate-200 flex items-center gap-2"><i data-lucide="activity" className="text-purple-400 w-5 h-5"></i>Williams Vix Fix (WVF)</h2></div>
                                        <WVFChart data={recentData} />
                                    </section>
                                </div>

                                {/* Category Analysis Section */}
                                <div className={activeTab === 'category' ? 'space-y-6' : 'hidden'}>
                                    <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                                        <h2 className="text-xl font-bold text-white border-l-4 border-green-500 pl-4">Category Analysis (Price & Volume)</h2>

                                        {/* Date Picker */}
                                        <div className="glass-panel rounded-xl px-4 py-3 flex items-center gap-3">
                                            <i data-lucide="calendar" className="w-5 h-5 text-blue-400"></i>
                                            <div className="flex flex-col">
                                                <span className="text-xs text-slate-400">Analysis Date</span>
                                                <span className="text-sm font-semibold text-white">{catStats?.date || 'Loading...'}</span>
                                            </div>
                                            <select
                                                value={selectedDate || ''}
                                                onChange={(e) => handleDateChange(e.target.value)}
                                                className="ml-2 bg-slate-700 text-white text-sm rounded-lg px-3 py-2 border border-slate-600 focus:ring-2 focus:ring-blue-500 focus:outline-none cursor-pointer hover:bg-slate-600 transition-colors"
                                            >
                                                <option value="">Latest Date</option>
                                                {availableDates.map(date => (
                                                    <option key={date} value={date}>{date}</option>
                                                ))}
                                            </select>
                                        </div>
                                    </div>

                                    {catStats ? (
                                        <div className="grid md:grid-cols-2 gap-6">
                                            <CategoryTable
                                                title="Top 10 RS Rank"
                                                data={catStats.table5 || []}
                                                columns={{
                                                    valueLabel: "Avg Rank",
                                                    renderValue: r => <span className="text-yellow-400 font-bold">{r.avg_rs_rank.toFixed(1)}</span>
                                                }}
                                                onSelect={handleSelectCategory}
                                            />
                                            <CategoryTable
                                                title="Top 10 RS Turning Stronger"
                                                data={catStats.table6 || []}
                                                columns={{
                                                    valueLabel: "RS Delta",
                                                    renderValue: r => {
                                                        const v = r.avg_rs_delta;
                                                        const color = v > 0 ? "text-emerald-400" : "text-red-400";
                                                        return <span className={`${color} font-bold`}>{v > 0 ? "+" : ""}{v.toFixed(1)}</span>;
                                                    }
                                                }}
                                                onSelect={handleSelectCategory}
                                            />
                                            <CategoryTable
                                                title="Top 10 Categories (1-Day Price Change)"
                                                data={catStats.table1 || []}
                                                columns={{
                                                    valueLabel: "Avg Change %",
                                                    renderValue: r => <span className={r.avg_change_1d > 0 ? "text-red-400" : "text-green-400"}>{r.avg_change_1d.toFixed(2)}%</span>
                                                }}
                                                onSelect={handleSelectCategory}
                                            />
                                            <CategoryTable
                                                title="Top 10 Categories (5-Day Price Change)"
                                                data={catStats.table2 || []}
                                                columns={{
                                                    valueLabel: "Avg Change %",
                                                    renderValue: r => <span className={r.avg_change_5d > 0 ? "text-red-400" : "text-green-400"}>{r.avg_change_5d.toFixed(2)}%</span>
                                                }}
                                                onSelect={handleSelectCategory}
                                            />
                                            <CategoryTable
                                                title="Vol Jump 1-Day (Ratio > 2)"
                                                data={catStats.table3 || []}
                                                columns={{
                                                    valueLabel: "Jump Ratio",
                                                    renderValue: r => <span>{(r.vol_jump_1d_ratio * 100).toFixed(0)}% ({r.vol_jump_1d_count}/{r.stock_count})</span>
                                                }}
                                                onSelect={handleSelectCategory}
                                            />
                                            <CategoryTable
                                                title="Vol Jump 3-Day (Ratio > 2)"
                                                data={catStats.table4 || []}
                                                columns={{
                                                    valueLabel: "Jump Ratio",
                                                    renderValue: r => <span>{(r.vol_jump_3d_ratio * 100).toFixed(0)}% ({r.vol_jump_3d_count}/{r.stock_count})</span>
                                                }}
                                                onSelect={handleSelectCategory}
                                            />
                                        </div>
                                    ) : (
                                        <div className="text-center text-slate-500">Loading Category Stats...</div>
                                    )}
                                </div>

                                {/* Level Analysis Section */}
                                <div className={activeTab === 'levels' ? 'space-y-6 block' : 'hidden'}>
                                    <h2 className="text-xl font-bold text-white border-l-4 border-blue-500 pl-4">Custom Levels Analysis</h2>
                                    <LevelAnalysisSection />
                                </div>

                                <div className={activeTab === 'correlation' ? 'space-y-6 block' : 'hidden'}>
                                    <h2 className="text-xl font-bold text-white border-l-4 border-emerald-500 pl-4">Stock-Metal Correlation</h2>
                                    <CorrelationAnalysisSection />
                                </div>

                                <div className={activeTab === 'news' ? 'space-y-6 block' : 'hidden'}>
                                    <h2 className="text-xl font-bold text-white border-l-4 border-purple-500 pl-4">News</h2>
                                    <StockNewsSection />
                                </div>


                            </>
                        )}
                    </main >
                </div >
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
