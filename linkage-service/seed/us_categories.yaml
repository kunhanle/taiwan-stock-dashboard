# =============================================================================
# US Thematic Category Seed  —  Taiwan-US Supply-Chain Linkage App
# =============================================================================
# Fine-grained US sub-sector taxonomy. Each category = ONE narrow sub-theme,
# represented by <=8 US-listed leader (龍頭) tickers. These are the "trigger"
# baskets: when a category's leaders move sharply, the linkage engine maps the
# move to the Taiwan nodes listed under `tw_linkage`.
#
# Field schema per category:
#   id              stable slug (do not rename once wired)
#   name_en/name_zh display names
#   cluster         high-level grouping
#   linkage         strong | medium | weak   (TW supply-chain coupling)
#   us_tickers      <=8 leader tickers (end-market representative)
#   tw_linkage      [{t: TW ticker, n: name, role: up|down|peer|dual}]
#                     up   = TW supplies INTO the US theme (upstream)
#                     down = TW sits downstream of the US theme
#                     peer = TW competitor / same layer
#                     dual = SAME company dual-listed (US ADR <-> TW local);
#                            NOT a linkage signal (self-correlation) — treat
#                            as identity, exclude from correlation scoring
#   flags           special situations (ADR / merger / bankruptcy / etc.)
#
# Verification: tickers web-verified as US-listed on 2026-06-18. Run a final
# programmatic pass against the live market-data feed before ingest (re-tickers
# like XYZ=Block, post-spin SNDK/WDC, and merger/bankruptcy names are the risk).
# A ticker may legitimately appear in multiple categories (different end-market
# -> different TW supplier). Dedupe is by category, NOT by ticker.
# =============================================================================

