services:
  backend:
    image: taiwan-stock-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: always
    env_file:
      - backend/.env
    environment:
      - DATA_DIR=/data
    expose:
      - "8050"
    volumes:
      - app_data:/data
    networks:
      - app-network

  caddy:
    image: caddy:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  app_data:
  caddy_data:
  caddy_config:
